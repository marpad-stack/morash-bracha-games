<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>אור הגיע אלינו</title>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;
 --cream:#F3EFE4;--paper:#FBF8F1;--teal:#1E4D4A;--navy:#2E3C5B;--ink:#2A2724;--sand:#E2D8C3;--blush:#F1E2E7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream)!important;color:var(--ink)!important}
body{font-family:'Assistant',-apple-system,'Segoe UI',Arial,sans-serif;overflow:hidden}
h1,h2,h3{font-family:'Suez One','Assistant',Georgia,serif;font-weight:400;margin:0}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--cream)}

/* פס עליון */
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;
 background:var(--paper);border-bottom:1px solid var(--sand)}
header h1{font-size:19px;color:var(--teal)}
#logo{height:36px;width:auto;display:block}
.grow{flex:1}
.btn{border:1px solid var(--sand);background:#fff;color:var(--teal);border-radius:999px;
 padding:9px 16px;font:600 14px/1 'Assistant',sans-serif;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* הספר */
#book{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
 padding:14px 14px 26px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 32%,#FBF8F1 0%,#EFEADC 58%,#E4DCC9 100%)}
#stack{position:relative;max-width:100%;max-height:100%;display:flex}
#stack::before,#stack::after{content:"";position:absolute;inset:0;border-radius:16px;
 background:var(--paper);box-shadow:0 2px 10px rgba(60,45,20,.10);z-index:-1}
#stack::before{transform:rotate(-1.1deg) translateY(3px)}
#stack::after{transform:rotate(1deg) translateY(5px)}
#pageImg{max-width:100%;max-height:100%;border-radius:16px;display:block;background:var(--paper);
 box-shadow:0 10px 34px rgba(60,45,20,.20);transition:transform .26s ease,opacity .26s ease}
#pageImg.fwd{animation:fwd .32s ease}
#pageImg.back{animation:back .32s ease}
@keyframes fwd{from{transform:translateX(26px) rotateY(-7deg);opacity:.25}to{transform:none;opacity:1}}
@keyframes back{from{transform:translateX(-26px) rotateY(7deg);opacity:.25}to{transform:none;opacity:1}}
.tapzone{position:absolute;top:0;bottom:0;width:33%;z-index:2;background:transparent;border:none;cursor:pointer}
#tapNext{left:0}#tapPrev{right:0}
#bookbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(226,216,195,.7)}
#bookbar i{display:block;height:100%;background:var(--teal);transition:width .26s ease}
.arrow{position:absolute;top:50%;z-index:3;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;
 border:none;background:rgba(30,77,74,.88);color:#fff;font-size:26px;cursor:pointer;line-height:1;
 display:flex;align-items:center;justify-content:center}
.arrow:disabled{opacity:.25;cursor:default}
#next{left:12px}#prev{right:12px}
#count{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
 background:rgba(251,248,241,.92);border:1px solid var(--sand);border-radius:999px;
 padding:4px 14px;font-size:13px;color:#7C6E58}

/* שורת המשחקים */
#games{flex:0 0 auto;position:relative;
 background:linear-gradient(180deg,#F6E7EC 0%,#F1E2E7 100%);
 padding:16px 12px calc(14px + env(safe-area-inset-bottom))}
#games::before{content:"";position:absolute;top:-11px;left:0;right:0;height:12px;
 background:radial-gradient(circle at 10px 0,transparent 11px,#F6E7EC 12px);
 background-size:22px 12px;background-repeat:repeat-x}
#games .lbl{font-family:'Suez One',serif;font-size:19px;letter-spacing:0;color:var(--teal);
 margin-bottom:12px;text-align:center}
#games .lbl::before{content:"🎲 "}#games .lbl::after{content:" 🎈"}
#games .row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
#games .row::-webkit-scrollbar{display:none}
.gbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;
 border:none;background:#fff;border-radius:22px;padding:12px 14px 11px;cursor:pointer;
 min-width:106px;font:700 14px/1.2 'Assistant',sans-serif;color:var(--navy);
 box-shadow:0 4px 12px rgba(60,45,20,.13);transition:transform .15s ease,box-shadow .15s ease}
.gbtn:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(60,45,20,.18)}
.gbtn:active{transform:scale(.96)}
.gbtn .ico{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;
 justify-content:center;padding:11px}
.gbtn svg{width:100%;height:100%}
.gbtn:nth-child(8n+1) .ico{background:#DCEBE4}
.gbtn:nth-child(8n+2) .ico{background:#DCE4F2}
.gbtn:nth-child(8n+3) .ico{background:#F6E3D3}
.gbtn:nth-child(8n+4) .ico{background:#F2DCE1}
.gbtn:nth-child(8n+5) .ico{background:#F3EBD3}
.gbtn:nth-child(8n+6) .ico{background:#DEE3F0}
.gbtn:nth-child(8n+7) .ico{background:#E2EFDC}
.gbtn:nth-child(8n+8) .ico{background:#F0E2F0}

/* חלון משחק */
#modal{position:fixed;inset:0;background:rgba(42,39,36,.55);display:none;
 align-items:center;justify-content:center;padding:14px;z-index:20}
#modal.on{display:flex}
#sheet{background:var(--cream);border-radius:24px;width:min(680px,100%);max-height:92vh;
 overflow-y:auto;padding:22px;text-align:center;position:relative}
#sheet h2{color:var(--teal);font-size:26px;margin-bottom:6px}
#sheet .how{font-size:15px;color:#7C6E58;max-width:36ch;margin:0 auto 16px}
#close{position:absolute;top:12px;left:12px;border:none;background:var(--sand);color:var(--ink);
 width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
#msg{font-family:'Suez One',serif;color:var(--teal);font-size:19px;min-height:28px;margin-top:14px}
.board{background:var(--paper);border:1px solid var(--sand);border-radius:20px;padding:18px}

.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{width:72px;height:72px;border-radius:16px;border:2px solid var(--sand);background:#fff;
 display:flex;align-items:center;justify-content:center;cursor:pointer;padding:7px}
.chip svg{width:100%;height:100%}
.chip[aria-pressed="true"]{border-color:var(--teal);transform:scale(1.08)}
.chip.done{opacity:.22;pointer-events:none}
.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
.drop{width:78px;height:78px;border-radius:16px;border:2px dashed #C9BCA0;background:#fff;
 display:flex;align-items:center;justify-content:center;padding:7px;cursor:pointer;position:relative}
.drop svg{width:100%;height:100%}
.drop .cap{position:absolute;bottom:-19px;font-size:11px;color:#9C8A6B;white-space:nowrap}
.drop.filled{border-style:solid;border-color:#B9D2C9;background:#F0F7F4}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}
.card{aspect-ratio:1/1;border-radius:14px;border:2px solid var(--sand);background:var(--teal);
 cursor:pointer;display:flex;align-items:center;justify-content:center;padding:9px}
.card svg{width:100%;height:100%;opacity:0;transition:opacity .2s}
.card.up{background:#fff}.card.up svg{opacity:1}
.card.matched{background:#F0F7F4;border-color:#B9D2C9;pointer-events:none}

.holdbtn{width:160px;height:160px;border-radius:50%;border:3px solid var(--teal);background:var(--paper);
 cursor:pointer;font:400 19px/1.3 'Suez One',serif;color:var(--teal)}
.meter{width:min(400px,80%);height:13px;border-radius:99px;background:var(--sand);
 overflow:hidden;margin:14px auto 0}
.meter i{display:block;height:100%;width:0;background:var(--teal);transition:width .1s linear}

.face{width:210px;height:210px;border-radius:50%;background:#FBE3CE;border:3px solid #E6C7A8;
 position:relative;margin:0 auto}
.facerow{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px}
.facerow button{border:1px solid var(--sand);background:#fff;border-radius:12px;width:42px;height:42px;
 font-size:19px;cursor:pointer;color:var(--teal)}
.facerow span{font-size:14px;color:#7C6E58;min-width:6ch}

.lights{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.lamp{width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;
 background:radial-gradient(circle at 40% 35%,#FFE9B8,#E8B94E);
 box-shadow:0 0 24px 6px rgba(232,185,78,.5);transition:all .35s}
.lamp.off{background:#3A4A70;box-shadow:none}

#canvas{background:#fff;border:2px solid var(--sand);border-radius:16px;touch-action:none;
 width:100%;max-width:520px;aspect-ratio:4/3}
.pens{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.pen{width:36px;height:36px;border-radius:50%;border:2px solid rgba(0,0,0,.12);cursor:pointer}
.pen[aria-pressed="true"]{border-color:var(--teal);transform:scale(1.14)}

@media (max-width:520px){
 header h1{font-size:16px}
 .arrow{width:46px;height:46px;font-size:22px}
 .chip{width:62px;height:62px}.drop{width:68px;height:68px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#grid{position:fixed;inset:0;background:var(--cream);z-index:30;display:none;overflow-y:auto;padding:60px 14px 24px}
#grid.on{display:block}
#gclose{position:fixed;top:12px;left:12px;border:none;background:var(--sand);width:40px;height:40px;
 border-radius:50%;font-size:20px;cursor:pointer;z-index:31}
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-width:900px;margin:0 auto}
.gwrap button{border:1px solid var(--sand);background:#fff;border-radius:12px;padding:4px;cursor:pointer;position:relative}
.gwrap img{width:100%;border-radius:9px;display:block}
.gwrap span{position:absolute;bottom:6px;right:8px;background:rgba(251,248,241,.9);border-radius:99px;
 padding:1px 7px;font-size:11px;color:#7C6E58}

/* הדפסה */
#print{display:none}
@media print{
 @page{size:A4;margin:9mm}
 html,body{background:#fff!important;overflow:visible!important;height:auto!important}
 #app,#modal,#grid{display:none!important}
 #print{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .psheet{page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid;
  display:flex;flex-direction:column;align-items:center;gap:5mm;padding-top:2mm}
 .psheet:last-child{page-break-after:auto;break-after:auto}
 .psheet figure{margin:0;text-align:center;page-break-inside:avoid;break-inside:avoid}
 .psheet .pg{width:128mm;height:128mm;object-fit:contain;border-radius:4mm;
  border:.5pt solid #D8CDB6;background:#FBF8F1;display:block}
 .psheet figcaption{font-size:8pt;color:#A79877;margin-top:1.5mm}
 .psheet.covr .pg{width:168mm;height:168mm;border:none}
 .psheet.covr{justify-content:center;min-height:250mm}
}
</style>
<style>@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#203e40;--teal:#188f91;--teal-dark:#0e666b;--coral:#f17f70;--cream:#fff9ed;--gold:#edbd51;--line:#203e401a;--shadow:0 18px 60px #193f3910}

-size:28px}.stat span{font-size:13px;color:#637674}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tag{background:#d9efea;color:#276b65;padding:6px 11px;border-radius:50px;font-size:12px;font-weight:800}.field{display:grid;gap:7px;margin:12px 0}input,select,textarea{padding:11px 14px;border:1px solid #ccd6ce;background:white;border-radius:12px;max-width:100%;color:var(--ink)}.is-hidden,[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:30px;max-width:min(780px,calc(100% - 24px));width:780px;max-height:92dvh;padding:28px;color:var(--ink);background:var(--cream);box-shadow:0 24px 120px #10272f50}dialog::backdrop{background:#173d43a8;backdrop-filter:blur(6px)}.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.dialog-top h2{margin:0;font-size:24px}.close{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:white;font-size:23px}.progress{height:10px;border-radius:20px;overflow:hidden;background:#dce9de;margin:16px 0}.progress>i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}.feedback{min-height:28px;text-align:center;font-weight:700;margin:12px 0;color:var(--teal-dark)}.pop{animation:pop .4s both}@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}.play-confetti{position:fixed;z-index:99999;pointer-events:none;width:9px;height:15px;top:-30px;animation:fall 1.7s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(700deg);opacity:.3}}.toast-msg{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:18px;padding:12px 22px;z-index:99999;max-width:90%;text-align:center}.footer{padding:32px 0;text-align:center;font-size:13px;color:#71817c}.controlbar{margin:16px auto;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px;background:#fffaf0;border:1px solid #dbcaa8;border-radius:18px;max-width:980px}.controlbar button,.controlbar select{min-height:40px}.mini-medal{font-weight:800;color:#8c600e}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice-grid button{min-height:90px}.choice-grid .emoji{font-size:36px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){.shell{padding:18px}.hero{grid-template-columns:1fr;gap:12px;padding:22px 0}.hero h1{font-size:44px}.brandbar{padding:15px 18px}.brandnote{display:none}.grid{grid-template-columns:1fr}.panel,dialog{padding:18px;border-radius:22px}.toolbar{gap:8px}.btn{padding:10px 14px}.stat{padding:10px 15px}.choice-grid{gap:8px}.choice-grid button{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

header{flex-wrap:wrap}header h1{font-size:clamp(23px,4vw,34px)}.book-intro{max-width:800px;margin:14px auto 24px;padding:0 20px;font-size:17px;line-height:1.8;text-align:center}#sheet .b-activity-head{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:12px;background:var(--cream);padding:12px 0;border-bottom:1px solid var(--sand)}#sheet .b-activity-head #close{position:static;flex:0 0 auto;width:auto;min-width:80px;min-height:44px;z-index:13;font-size:17px;padding:8px 12px;touch-action:manipulation}#sheet .b-activity-head h2{margin:0;font-size:24px}#sheet>.reading-controls{margin-left:0!important} .hero{display:block!important}.mem{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px!important}.mem .card{background:#358f8b;border-radius:18px;box-shadow:0 5px 0 #196965}.mem .card.up{background:#f5d385}.mem .card.matched{background:#cce4d5}.gbtn{border-radius:23px!important;box-shadow:0 7px 0 #e4d7bd60;position:relative}.gbtn.b-earned:after{content:'★';position:absolute;top:4px;left:10px;color:#ba8826}.b-lights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px auto;max-width:390px}.b-lights button{height:84px;border:5px solid #fff5db;border-radius:20px;color:#fff9e9;font-size:35px}.modal .box{border-radius:28px}#pageImg{border-radius:12px}.controlbar .btn{font-size:13px;padding:8px 12px}@media(max-width:600px){.mem .card{min-width:0}.controlbar{margin:10px}}

<style>/* Shared interaction language; each game keeps its own visual world. */
.reading-controls{display:flex;align-items:center;justify-content:flex-end;gap:6px;direction:rtl;flex-wrap:wrap;margin:8px 0;position:relative;z-index:4;font:700 13px/1.4 Heebo,Arial,sans-serif}
.reading-controls button,.legacy-reading{min-height:42px;min-width:44px;border:1px solid #bdd3c6;border-radius:13px;padding:8px 12px;background:#fffcf4;color:#31544c;box-shadow:0 3px 0 #35554812;font:inherit;cursor:pointer}
.reading-controls button[aria-pressed=true],.legacy-reading[aria-pressed=true]{background:#1b6965;color:#fff9ec;border-color:#1b6965}
.reading-controls button:hover{filter:brightness(1.07)}.reading-controls button:active{transform:translateY(2px)}
.compact-reading{margin:0 0 10px;gap:5px}.compact-reading button{padding:6px 10px;min-height:38px;font-size:12px}
.dialog-top>.compact-reading{margin:0 auto 0 10px;order:2}.dialog-top>.close{order:3}
.ptop>.compact-reading{margin:0}.ptop>.compact-reading button span{display:none}
.reading-pointed .riddle,.reading-pointed .quote,.reading-pointed .challenge-label,.reading-pointed .instruction,.reading-pointed .how,.reading-pointed .cardtxt{line-height:1.95}
.reading-pointed h1{line-height:1.35!important;letter-spacing:0!important}
.reading-large .riddle,.reading-large .quote,.reading-large .story,.reading-large .how,.reading-large .cardtxt,.reading-large .instruction,.reading-large #askText,.reading-large #bubble-text{font-size:clamp(21px,2.4vw,28px)!important;line-height:2!important}
.reading-large .choice-grid button,.reading-large .decision button{font-size:20px}
.game-cover{display:block;object-fit:cover;width:100%;height:auto;aspect-ratio:3/2;border-radius:26px;box-shadow:0 18px 45px #244c3920;pointer-events:none}
.game-banner{position:relative;overflow:hidden;border-radius:26px;margin:18px auto 24px;max-width:980px;border:6px solid #fffdf6;box-shadow:0 12px 45px #233d3217}
.game-banner .game-cover{border-radius:19px;max-height:280px;object-position:center;box-shadow:none}
body[data-morash-part=a] .hero{display:grid!important;grid-template-columns:1.05fr 1fr;gap:30px;text-align:right;align-items:center;max-width:1100px;margin:auto}
body[data-morash-part=a] .hero>.quality-art{grid-column:2;grid-row:1/8}
body[data-morash-part=a] .gcard{border:1px solid #ffffff90;position:relative;isolation:isolate;overflow:hidden;box-shadow:0 8px 0 #426a4916,0 20px 40px #33573c12}
body[data-morash-part=a] .gcard:before{content:'';position:absolute;width:180px;height:180px;border:20px solid #ffffff12;border-radius:50%;top:-65px;left:-70px;z-index:-1}
body[data-morash-part=a] .g1{background:linear-gradient(145deg,#307f91,#354e8b)}
body[data-morash-part=a] .g2{background:linear-gradient(145deg,#397957,#79974f)}
body[data-morash-part=a] .g3{background:linear-gradient(145deg,#ce7662,#c09353)}
body[data-morash-part=a] .g4{background:linear-gradient(145deg,#77649d,#416e8a)}
body[data-morash-part=a] .gcard p{font-size:15px;line-height:1.85}
body[data-morash-part=b] #book{background-image:linear-gradient(#f3edf9db,#ece6f2ec),var(--game-art);background-position:center;background-size:cover}
body[data-morash-part=b] #app{padding-top:0}body[data-morash-part=b] #readingToolbar{margin:0;display:flex;padding:6px 14px;background:#fffaf0;border-bottom:1px solid #e0d8c6;flex-shrink:0}
body[data-morash-part=b] #sheet{padding-top:20px}body[data-morash-part=b] #sheet>.reading-controls{justify-content:flex-start;padding-right:42px}
body[data-morash-part=b] .controlbar{margin:0;max-width:none;border:0;border-radius:0;padding:6px 10px;font-size:12px;gap:6px;flex-shrink:0}
body[data-morash-part=b] .controlbar select{padding:6px 9px;min-height:36px}body[data-morash-part=b] .controlbar .btn{min-height:36px;font-size:12px}
body[data-morash-part=b] #games{background:linear-gradient(#ede6f5,#e4dcec)}body[data-morash-part=b] #games:before{display:none}
body[data-morash-part=b] .gbtn{background:#fff9f1;border:1px solid #ddd1e4;min-width:103px}
body[data-morash-part=b] .gbtn .ico{background:#e6deed}
.book-reading-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin:24px 0}
.book-reading-layout img{width:100%;border-radius:18px;border:1px solid #dfd4bb;position:sticky;top:0}
.book-reading-text{white-space:pre-line;font:500 22px/2 Heebo,Arial,sans-serif;color:#294a47}
.book-reading-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;bottom:-28px;background:#fff9ed;padding:12px 0;border-top:1px solid #ded6c3}
#bookReaderDialog{width:1050px;max-width:calc(100% - 24px)}
.reading-large .book-reading-text{font-size:27px;line-height:2.1}
body[data-morash-part=c] .house{background-image:var(--game-art);background-size:cover;background-position:center;aspect-ratio:1.3;border:7px solid #fffcf2}
body[data-morash-part=c] .house>svg{visibility:hidden}
body[data-morash-part=c] .hotspot{background:#fff9e8;border-color:#fff;box-shadow:0 6px 0 #72512766,0 0 0 7px #fff8}
body[data-morash-part=c] .hotspot:hover{box-shadow:0 7px 0 #72512766,0 0 0 10px #f7d16b99}
body[data-morash-part=c] .maplist button{min-height:44px;line-height:1.65;font-size:14px}
body[data-morash-part=c] .subhero{margin:0 0 12px}body[data-morash-part=c] .hero{gap:30px;padding-top:5px}
body[data-morash-part=c] #readingToolbar{margin:0 0 6px}body[data-morash-part=c] #nikud{display:none}
body[data-morash-part=c] .arena{background:radial-gradient(circle at 15% 20%,#fff9d888,transparent 30%),linear-gradient(145deg,#d7ebdd,#a8d0c7)}
body[data-morash-part=c] .arena:before{content:'✦';position:absolute;bottom:-70px;right:-25px;font-size:230px;line-height:1;color:#fff4;transform:rotate(15deg);pointer-events:none}
.stage-progress{display:flex;align-items:center;gap:12px;direction:ltr;color:#587565;font-weight:800}.stage-progress .progress{flex:1}.stage-progress>span{min-width:55px;text-align:center;font-size:16px}.practice-pattern{font-size:27px;line-height:1.8;text-align:center;min-height:32px;padding:8px;direction:rtl}
body[data-morash-part=c] .target{z-index:1}.target:active{scale:.85}
body[data-morash-part=c] .cards button{background:linear-gradient(145deg,#327e87,#21545f);border:2px solid #ffffff55}
body[data-morash-part=c] .cards button.up{background:#f6d477}
body[data-morash-part=c] .cards button.matched{background:#cae6d9;color:#235e51;opacity:1}
body[data-morash-part=d] #setup>.game-banner{margin-top:6px}body[data-morash-part=d] #setup>.game-banner .game-cover{max-height:240px}
body[data-morash-part=d] .d-build-choice{transition:transform .2s,background .2s;border-bottom-width:5px}
body[data-morash-part=d] .boardwrap{border-radius:30px}body[data-morash-part=d] #cardSheet>.reading-controls{justify-content:flex-start}
body[data-morash-part=e] .sbox{max-width:740px}body[data-morash-part=e] .sbox>.game-banner{margin:12px 0 20px;border-width:4px}
body[data-morash-part=e] .sbox>.game-banner .game-cover{max-height:230px}
body[data-morash-part=e] #readingToolbar{padding:4px 14px;margin:0;background:#fffaf0;flex-shrink:0}
body[data-morash-part=e] .niqbtn{height:auto;min-height:38px;white-space:normal}
body[data-morash-part=f] .opening>.game-banner{max-width:680px;border-color:#5d604c;margin-bottom:25px}
body[data-morash-part=f] .opening>.game-banner .game-cover{max-height:270px}
body[data-morash-part=f] #readingToolbar{max-width:980px;margin:5px auto;padding:0 14px}
body[data-morash-part=f] .reading-controls button{color:#4c3d2c;background:#fff4d8;border-color:#d2b36c}
body[data-morash-part=f] .reading-controls button[aria-pressed=true]{background:#edc06d;color:#352c1f}
body[data-morash-part=g] .folder-art{display:block;background:none;min-height:0}
body[data-morash-part=g] .folder-art>.folder{display:none}body[data-morash-part=g] .folder-art .game-cover{transform:rotate(-3deg);border:7px solid #fff9ea;box-shadow:10px 14px 0 #d8c49e}
body[data-morash-part=g] .scene{background-image:var(--game-art);background-position:center;background-size:cover;aspect-ratio:1.7}
body[data-morash-part=g] .scene>svg{visibility:hidden}
body[data-morash-part=g] .clue{background:#fbf2d53b;border-radius:50%;text-shadow:0 2px 4px #2b1f16;min-width:44px;min-height:44px}
body[data-morash-part=g] .scene.guided .clue{background:#fff8dcbb}
body[data-morash-part=g] .clue.found{opacity:.65}.clue:hover{scale:1.12}
body[data-morash-part=g] .board{background-image:radial-gradient(#88673d22 .9px,transparent 1px);background-size:5px 5px}
body[data-morash-part=h] .studio-header{padding:28px;border:1px solid #e6d5c7;background:#fff9ef;border-radius:28px;position:relative;overflow:hidden}
body[data-morash-part=h] .studio-header:after{content:'';position:absolute;width:210px;inset:0 0 0 auto;background:var(--game-art) center/cover;opacity:.16;pointer-events:none}
body[data-morash-part=h] .studio-header>*{position:relative;z-index:1}
body[data-morash-part=h] .canvas-wrap{background:radial-gradient(#d9bcad60 1px,transparent 1px),#f1e3d6;background-size:17px 17px;border:1px solid #e0cfc0;border-radius:28px}
body[data-morash-part=h] .tool-section{padding-bottom:22px;margin-bottom:22px}.sticker-list button{min-height:47px;transition:transform .15s}.sticker-list button:hover{transform:rotate(-8deg) scale(1.12)}
body[data-morash-part=i] .hero{display:block}body[data-morash-part=i] .heroHead{gap:18px}body[data-morash-part=i] .hero{background-image:linear-gradient(90deg,#fffdf7f2,#fffdf7d9),var(--game-art);background-size:cover;background-position:center}
body[data-morash-part=i].night .hero{background-image:linear-gradient(90deg,#1b242ce8,#1b242ce8),var(--game-art)}
body[data-morash-part=j] .brand{border-bottom:1px solid #c8bcb340}body[data-morash-part=j] .intro-art{border:5px solid #fffaf2;border-radius:28px;overflow:hidden;margin:20px 0}
body[data-morash-part=j] .intro-art img{max-height:210px;box-shadow:none;border-radius:22px}
body[data-morash-part=j] .card{box-shadow:0 14px 40px #5745380c}.quality-credit{font-size:12px;text-align:center;color:#64766f;line-height:1.8;padding:20px}

  .book-reading-layout{grid-template-columns:1fr;gap:16px}.book-reading-layout img{width:170px;position:static;margin:auto}.book-reading-text{font-size:22px}.book-reading-nav{bottom:-18px}.book-reading-nav .btn{font-size:12px;padding:8px 10px}#bookReaderCount{font-size:12px;white-space:nowrap}
  body[data-morash-part=a] .hero{display:flex!important;flex-direction:column;gap:14px;text-align:center}
  body[data-morash-part=a] .hero>.quality-art{width:100%;max-width:480px;order:-1}.game-cover{border-radius:20px}
  body[data-morash-part=c] .house{aspect-ratio:1.2}.reading-controls button{font-size:12px;padding:8px 10px}
  body[data-morash-part=c] .hero{gap:18px}body[data-morash-part=c] .house{margin:0}.subhero .stat{padding:8px 11px}
  body[data-morash-part=c] .subhero .toolbar{gap:5px}.game-banner .game-cover{max-height:200px!important}
  body[data-morash-part=g] .folder-art{display:block;max-width:420px;margin:10px auto 15px}
  body[data-morash-part=g] .scene{aspect-ratio:1.3}body[data-morash-part=h] .studio-header{padding:20px}
  body[data-morash-part=b] header{flex-wrap:wrap;gap:6px;padding:8px 10px}body[data-morash-part=b] header h1{font-size:16px}
  body[data-morash-part=b] #readingToolbar{padding:4px 9px}body[data-morash-part=b] #games{padding:10px 8px}
  body[data-morash-part=b] #games .lbl{font-size:16px;margin-bottom:6px}body[data-morash-part=b] .gbtn{padding:10px;min-width:92px}
  body[data-morash-part=b] #book{min-height:160px}body[data-morash-part=b] .controlbar{gap:4px}
  body[data-morash-part=b] #bookBookmark{font-size:11px}.dialog-top{flex-wrap:wrap;gap:8px}
  .dialog-top h2{flex:1}.dialog-top>.reading-controls{order:4;flex-basis:100%;justify-content:flex-start;margin:0}
  body[data-morash-part=e] #readingToolbar{padding:3px 10px}body[data-morash-part=e] .sbox{padding:24px 18px}
}
@media print{.reading-controls,.game-banner,.quality-art,.quality-credit,.intro-art{display:none!important}}

body[data-morash-part=a] .topbar>.nk{display:none}
body[data-morash-part=f] #nikudBtn1,body[data-morash-part=f] #nikudBtn2{display:none}

body[data-morash-part=i] .hero{padding:22px}
body[data-morash-part=i] .heroHead{flex-wrap:wrap;gap:10px}
body[data-morash-part=i] .heroHead .tools{flex-wrap:wrap}
body[data-morash-part=g] .hero>div{min-width:0}
body[data-morash-part=g] .toolbar .chip{max-width:100%;flex-wrap:wrap}
body[data-morash-part=g] #level{min-width:0;max-width:100%;font-size:14px}
@media(max-width:700px){body[data-morash-part=g] .hero{grid-template-columns:minmax(0,1fr)}body[data-morash-part=g] .folder-art{width:92%}}

const GAMES=[
 {id:'memory',icon:'house',t:"נראה מי זוכר?",how:"הופכים שני קלפים ומחפשים תמונות זהות מתוך הסיפור. אפשר להיעזר בהצצה."},
 {id:'patience',icon:'moon',t:"משחק השקט",how:"מניחים אצבע על העיגול ועוזרים לתינוק להירדם. עזבתם באמצע? לא נורא, ממשיכים בדיוק מאיפה שהפסקתם!"},
 {id:'dress',icon:'shirt',t:"מתלבשים נכון!",how:"בוחרים בגד ומניחים אותו על התינוק בגרירה, או בלחיצה על המקום המתאים. מרכיבים לבוש ליום חול או לשבת."},
 {id:'face',icon:'baby',t:"מי שטוב לו ושמח!",how:"הרכיבו פרצוף. אין פרצוף לא נכון."},
 {id:'table',icon:'candle',t:"עורכים שולחן שבת!",how:"בוחרים חפץ, ובלחיצה מעבירים אותו למקום הנכון בשולחן."},
 {id:'quiet',icon:'star',t:"שומרים על השקט!",how:"כל לחיצה משנה את האור שבחרתם ואת האורות הצמודים אליו. מכבים את כולם; אפשר לבקש רמז."},
 {id:'needs',icon:'bottle',t:"מה נביא לתינוק?",how:"מסתכלים על התינוק, בוחרים מה להביא לו ומגלים מה קורה. נסו את שלושת החפצים."},
 {id:'draw',icon:'pencil',t:'ציור חופשי',how:'ציירו משהו שאתם אוהבים לעשות יחד במשפחה.'}
];
document.getElementById('grow').innerHTML=GAMES.map(g=>
 `<button class="gbtn" data-g="${g.id}"><span class="ico">${ic(g.icon)}</span><span>${g.t}</span></button>`).join('');

const modal=document.getElementById('modal'),gb=document.getElementById('gb'),msg=document.getElementById('msg');
document.querySelectorAll('.gbtn').forEach(b=>b.onclick=()=>openGame(b.dataset.g));
document.getElementById('close').onclick=()=>modal.classList.remove('on');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};

function openGame(id){bCurrent=id;bRoundLevel=bLevel;
 const g=GAMES.find(x=>x.id===id);
 document.getElementById('gtitle').textContent=g.t;
 document.getElementById('ghow').textContent=g.how;
 gb.innerHTML='';msg.textContent='';
 modal.classList.add('on');
 START[id](gb,msg);
}

/* ---------- הספר ---------- */
let p=0;
const img=document.getElementById('pageImg'),cnt=document.getElementById('count'),
      bPrev=document.getElementById('prev'),bNext=document.getElementById('next');
const fill=document.getElementById('bookfill');
function show(dir){if(typeof PlayUI!=="undefined")PlayUI.save("morash-book-page",p);
 try{img.src=PAGES[p];}catch(e){cnt.textContent='שגיאה בטעינת העמוד';return;}
 cnt.textContent=(p+1)+' מתוך '+PAGES.length;
 bPrev.disabled=p===0;bNext.disabled=p===PAGES.length-1;
 fill.style.width=((p+1)/PAGES.length*100)+'%';
 if(dir){img.classList.remove('fwd','back');void img.offsetWidth;
  img.classList.add(dir>0?'fwd':'back');}
 if(p+1<PAGES.length)new Image().src=PAGES[p+1];
 if(p>0)new Image().src=PAGES[p-1];
}
const goNext=()=>{if(p<PAGES.length-1){p++;show(1);}};
const goPrev=()=>{if(p>0){p--;show(-1);}};
bNext.onclick=goNext;bPrev.onclick=goPrev;
document.getElementById('tapNext').onclick=goNext;
document.getElementById('tapPrev').onclick=goPrev;

const grid=document.getElementById('grid');
document.getElementById('gridBtn').onclick=()=>{
 const w=document.getElementById('gwrap');
 if(!w.innerHTML)w.innerHTML=PAGES.map((s,i)=>
  `<button data-i="${i}"><img src="${s}" alt=""><span>${i+1}</span></button>`).join('');
 w.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  p=+b.dataset.i;show(1);grid.classList.remove('on');});
 grid.classList.add('on');
};
document.getElementById('gclose').onclick=()=>grid.classList.remove('on');
document.addEventListener('keydown',e=>{
 if(modal.classList.contains('on')||document.querySelector('dialog[open]')||e.target.matches('input,select,textarea'))return;
 if(e.key==='ArrowLeft'){e.preventDefault();goNext();}
 if(e.key==='ArrowRight'){e.preventDefault();goPrev();}
 if(e.key==='Escape')grid.classList.remove('on');});
let sx=null;
document.getElementById('book').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.getElementById('book').addEventListener('touchend',e=>{
 if(sx===null)return;const d=e.changedTouches[0].clientX-sx;sx=null;
 if(d<-45)goNext();if(d>45)goPrev();},{passive:true});
show();

/* ---------- הדפסה ---------- */
document.getElementById('printBtn').onclick=()=>{
 const c=document.getElementById('print');
 if(!c.innerHTML){
  const fig=i=>`<figure><img class="pg" src="${PAGES[i]}"><figcaption>${i+1}</figcaption></figure>`;
  let h=`<div class="psheet covr">${fig(0)}</div>`;
  for(let i=1;i<PAGES.length;i+=2){
   h+=`<div class="psheet">${fig(i)}${i+1<PAGES.length?fig(i+1):''}</div>`;

\" אמר אבא בשמחה.\n\"יש לנו תינוק חדש בבית.\"\n\nהלב של מענדי קפץ משמחה, אבל יחד איתו קפצה גם שאלה קטנה:\n\"ומה יהיה איתי עכשיו?\"", "\"בָּרוּךְ הַבָּא!\" אָמַר אַבָּא בְּשִׂמְחָה.\n\"יֵשׁ לָנוּ תִּינוֹק חָדָשׁ בַּבַּיִת.\"\n\nהַלֵּב שֶׁל מֶענְדִּי קָפַץ מִשִּׂמְחָה, אֲבָל יַחַד אִיתּוֹ קָפְצָה גַּם שְׁאֵלָה קְטַנָּה:\n\"וּמָה יִהְיֶה אִיתִּי עַכְשָׁיו?\""], ["היום הזה התחיל כמו כל יום.\nאבל כשאבא פתח את הדלת — הוא לא נכנס לבד.\n\nאמא חייכה חיוך עייף ושמח.\nבידיה הייתה שמיכה לבנה ורכה, ומתוכה הציץ תינוק קטן.", "הַיּוֹם הַזֶּה הִתְחִיל כְּמוֹ כָּל יוֹם.\nאֲבָל כְּשֶׁאַבָּא פָּתַח אֶת הַדֶּלֶת — הוּא לֹא נִכְנַס לְבַד.\n\nאִמָּא חִיְּיכָה חִיּוּךְ עָיֵיף וְשָׂמֵחַ.\nבְּיָדֶיהָ הָיְיתָה שְׂמִיכָה לְבָנָה וְרַכָּה, וּמִתּוֹכָהּ הֵצִיץ תִּינוֹק קָטָן."], ["עוד לפני שהספיק להוריד את הנעליים, כולם כבר עמדו סביב התינוק.\n\nאבא. אמא. סבתא.\nאפילו השכנה יעל אמרה \"מזל טוב!\"\n\nומענדי נשאר לרגע בצד.\nמה עושים?\n\nמחכים בשקט\nמושכים לאמא בעדינות בשרוול\nנדחקים מעט קדימה כדי לראות גם", "עוֹד לִפְנֵי שֶׁהִסְפִּיק לְהוֹרִיד אֶת הַנַּעֲלַיִים, כּוּלָּם כְּבָר עָמְדוּ סְבִיב הַתִּינוֹק.\n\nאַבָּא. אִמָּא. סַבְתָּא.\nאֲפִילּוּ הַשְּׁכֵנָה יָעֵל אָמְרָה \"מַזָּל טוֹב!\"\n\nוּמֶענְדִּי נִשְׁאַר לְרֶגַע בַּצַּד.\nמָה עוֹשִׂים?\n\nמְחַכִּים בְּשֶׁקֶט\nמוֹשְׁכִים לְאִמָּא בַּעֲדִינוּת בַּשַּׁרְווּל\nנִדְחָקִים מְעַט קָדִימָה כְּדֵי לִרְאוֹת גַּם"], ["עכשיו אתה כבר לא עומד בצד. אתה מתקרב ורואה פנים קטנטנות, ממש מקרוב.", "עַכְשָׁיו אַתָּה כְּבָר לֹא עוֹמֵד בַּצַּד. אַתָּה מִתְקָרֵב וְרוֹאֶה פָּנִים קְטַנְטַנּוֹת, מַמָּשׁ מִקָּרוֹב."], ["ומה קורה?\n\nנדחקים מעט קדימה כדי לראות גם.\nאבא מבחין בך ומפנה מקום: \"בוא, אח גדול סקרן. המקום הזה חיכה לך.\"\n\nמחכים בשקט.\nאמא מרימה אליך מבט חם: \"ראיתי שחיכית. עכשיו בוא אליי.\"\n\nמושכים לאמא בעדינות בשרוול.\nאמא מלטפת את ידך: \"גם אותך אני צריכה קרוב.\"", "וּמָה קוֹרֶה?\n\nנִדְחָקִים מְעַט קָדִימָה כְּדֵי לִרְאוֹת גַּם.\nאַבָּא מַבְחִין בְּךָ וּמְפַנֶּה מָקוֹם: \"בּוֹא, אָח גָּדוֹל סַקְרָן. הַמָּקוֹם הַזֶּה חִיכָּה לְךָ.\"\n\nמְחַכִּים בְּשֶׁקֶט.\nאִמָּא מְרִימָה אֵלֶיךָ מַבָּט חַם: \"רָאִיתִי שֶׁחִיכִּיתָ. עַכְשָׁיו בּוֹא אֵלַיּי.\"\n\nמוֹשְׁכִים לְאִמָּא בַּעֲדִינוּת בַּשַּׁרְווּל.\nאִמָּא מְלַטֶּפֶת אֶת יָדְךָ: \"גַּם אוֹתְךָ אֲנִי צְרִיכָה קָרוֹב.\""], ["בדיוק כשאמא מתיישבת לשחק איתך, התינוק מתחיל לבכות. אמא קמה מיד, והמשחק נשאר על הרצפה.\n\nופתאום מרגישים בלב קצת לא נעים.\nמה עושים?\n\nמחליטים לעזור ומביאים שמיכה קטנה\nאומרים: \"רציתי שתשחקי איתי...\"\nמתיישבים קצת בצד", "בְּדִיּוּק כְּשֶׁאִמָּא מִתְיַישֶּׁבֶת לְשַׂחֵק אִיתְּךָ, הַתִּינוֹק מַתְחִיל לִבְכּוֹת. אִמָּא קָמָה מִיָּד, וְהַמִּשְׂחָק נִשְׁאַר עַל הָרִצְפָּה.\n\nוּפִתְאוֹם מַרְגִּישִׁים בַּלֵּב קְצָת לֹא נָעִים.\nמָה עוֹשִׂים?\n\nמַחְלִיטִים לַעֲזוֹר וּמְבִיאִים שְׂמִיכָה קְטַנָּה\nאוֹמְרִים: \"רָצִיתִי שֶׁתְּשַׂחֲקִי אִיתִּי...\"\nמִתְיַישְּׁבִים קְצָת בַּצַּד"], ["לא תמיד קל לחכות, אבל קל יותר כשמישהו מחכה איתך.", "לֹא תָּמִיד קַל לְחַכּוֹת, אֲבָל קַל יוֹתֵר כְּשֶׁמִּישֶׁהוּ מְחַכֶּה אִיתְּךָ."], ["ומה קורה?\n\nאומרים: \"רציתי שתשחקי איתי...\"\nאמא מתכופפת ומחבקת אותך: \"אני יודעת. נשמור את המשחק בדיוק כאן ונחזור אליו.\"\n\nמחליטים לעזור ומביאים שמיכה קטנה.\n\"איזה עוזר נפלא,\" מחייכת אמא. \"הבאת בדיוק מה שהיינו צריכים.\"\n\nמתיישבים קצת בצד.\nאבא מתיישב לידך: \"לפעמים גם לי קשה לחכות. נחכה יחד.\"", "וּמָה קוֹרֶה?\n\nאוֹמְרִים: \"רָצִיתִי שֶׁתְּשַׂחֲקִי אִיתִּי...\"\nאִמָּא מִתְכּוֹפֶפֶת וּמְחַבֶּקֶת אוֹתְךָ: \"אֲנִי יוֹדַעַת. נִשְׁמוֹר אֶת הַמִּשְׂחָק בְּדִיּוּק כָּאן וְנַחֲזוֹר אֵלָיו.\"\n\nמַחְלִיטִים לַעֲזוֹר וּמְבִיאִים שְׂמִיכָה קְטַנָּה.\n\"אֵיזֶה עוֹזֵר נִפְלָא,\" מְחַיֶּיכֶת אִמָּא. \"הֵבֵאתָ בְּדִיּוּק מָה שֶׁהָיִינוּ צְרִיכִים.\"\n\nמִתְיַישְּׁבִים קְצָת בַּצַּד.\nאַבָּא מִתְיַישֵּׁב לְיָדְךָ: \"לִפְעָמִים גַּם לִי קָשֶׁה לְחַכּוֹת. נְחַכֶּה יַחַד.\""], ["\"איזה תינוק מתוק!\" \"איזה חיוך!\"\n\"ואילו לחייים!\"\n\nכולם מדברים על התינוק, ואף אחד עדיין לא שם לב שלבשת את החולצה לבד.\nמה עושים?\n\nמביאים לאורחים עוגיות\nמספרים: \"גם אני התלבשתי לבד!\"\nמרגישים קצת קנאה", "\"אֵיזֶה תִּינוֹק מָתוֹק!\" \"אֵיזֶה חִיּוּךְ!\"\n\"וְאֵילּוּ לְחָיַיִים!\"\n\nכּוּלָּם מְדַבְּרִים עַל הַתִּינוֹק, וְאַף אֶחָד עֲדַיִין לֹא שָׂם לֵב שֶׁלָּבַשְׁתָּ אֶת הַחוּלְצָה לְבַד.\nמָה עוֹשִׂים?\n\nמְבִיאִים לָאוֹרְחִים עוּגִיּוֹת\nמְסַפְּרִים: \"גַּם אֲנִי הִתְלַבַּשְׁתִּי לְבַד!\"\nמַרְגִּישִׁים קְצָת קִנְאָה"], ["פתאום כולם מביטים גם בחולצה, גם בעזרה — ובעיקר בך.", "פִּתְאוֹם כּוּלָּם מַבִּיטִים גַּם בַּחוּלְצָה, גַּם בְּעֶזְרָה — וּבְעִיקָּר בְּךָ."], ["ומה קורה?\n\nמספרים: \"גם אני התלבשתי לבד!\"\nאבא מסתובב אליך בגאווה: \"באמת? זה הישג של ילד גדול!\"\n\nמרגישים קצת קנאה.\nאמא מבחינה בפנים שלך ולוחשת: \"לפעמים רוצים שיראו גם אותנו. יש בלב שלי מקום לשניכם.\"\n\nמביאים לאורחים עוגיות.\nסבתא לוקחת עוגייה וקורצת: \"יש כאן גם אח גדול מתוק במיוחד.\"", "וּמָה קוֹרֶה?\n\nמְסַפְּרִים: \"גַּם אֲנִי הִתְלַבַּשְׁתִּי לְבַד!\"\nאַבָּא מִסְתּוֹבֵב אֵלֶיךָ בְּגַאֲוָוה: \"בֶּאֱמֶת? זֶה הֶישֵּׂג שֶׁל יֶלֶד גָּדוֹל!\"\n\nמַרְגִּישִׁים קְצָת קִנְאָה.\nאִמָּא מַבְחִינָה בַּפָּנִים שֶׁלְּךָ וְלוֹחֶשֶׁת: \"לִפְעָמִים רוֹצִים שֶׁיִּרְאוּ גַּם אוֹתָנוּ. יֵשׁ בַּלֵּב שֶׁלִּי מָקוֹם לִשְׁנֵיכֶם.\"\n\nמְבִיאִים לָאוֹרְחִים עוּגִיּוֹת.\nסַבְתָּא לוֹקַחַת עוּגִיָּיה וְקוֹרֶצֶת: \"יֵשׁ כָּאן גַּם אָח גָּדוֹל מָתוֹק בִּמְיוּחָד.\""], ["פתאום התינוק עושה פרצוף מצחיק. הוא מכווץ את האף, מנפח את הלחייים ופותח פה קטן.\nכולם מחכים.\nואז... פיהוק גדול!\n\nאבא מרים גבה: \"נראה שיש לו כבר מה לומר!\"\nכולם פורצים בצחוק.\nמה עושים?\n\nצוחקים יחד\nעושים פרצוף מצחיק אפילו יותר\nמוחאים כפיים לתינוק", "פִּתְאוֹם הַתִּינוֹק עוֹשֶׂה פַּרְצוּף מַצְחִיק. הוּא מְכַוֵּוץ אֶת הָאַף, מְנַפֵּחַ אֶת הַלְּחָיַיִים וּפוֹתֵחַ פֶּה קָטָן.\nכּוּלָּם מְחַכִּים.\nוְאָז... פִּיהוּק גָּדוֹל!\n\nאַבָּא מֵרִים גַּבָּה: \"נִרְאֶה שֶׁיֵּשׁ לוֹ כְּבָר מָה לוֹמַר!\"\nכּוּלָּם פּוֹרְצִים בִּצְחוֹק.\nמָה עוֹשִׂים?\n\nצוֹחֲקִים יַחַד\nעוֹשִׂים פַּרְצוּף מַצְחִיק אֲפִילּוּ יוֹתֵר\nמוֹחֲאִים כַּפַּיִים לַתִּינוֹק"], ["לפעמים תינוק קטן מביא איתו לבית צחוק גדול.", "לִפְעָמִים תִּינוֹק קָטָן מֵבִיא אִיתּוֹ לַבַּיִת צְחוֹק גָּדוֹל."], ["ומה קורה?\n\nצוחקים יחד.\nהצחוק שלך מתגלגל בכל החדר, והתינוק ממצמץ בהפתעה.\n\nעושים פרצוף מצחיק אפילו יותר.\nעכשיו כולם צוחקים גם מהפרצוף שלך.\nלרגע אתה והתינוק צוות של מצחיקים.\n\nמוחאים כפיים לתינוק.\nהתינוק מזיז את שתי ידיו, כאילו הוא מוחא לך כפיים בחזרה.", "וּמָה קוֹרֶה?\n\nצוֹחֲקִים יַחַד.\nהַצְּחוֹק שֶׁלְּךָ מִתְגַּלְגֵּל בְּכָל הַחֶדֶר, וְהַתִּינוֹק מְמַצְמֵץ בְּהַפְתָּעָה.\n\nעוֹשִׂים פַּרְצוּף מַצְחִיק אֲפִילּוּ יוֹתֵר.\nעַכְשָׁיו כּוּלָּם צוֹחֲקִים גַּם מֵהַפַּרְצוּף שֶׁלְּךָ.\nלְרֶגַע אַתָּה וְהַתִּינוֹק צֶוֶות שֶׁל מַצְחִיקִים.\n\nמוֹחֲאִים כַּפַּיִים לַתִּינוֹק.\nהַתִּינוֹק מֵזִיז אֶת שְׁתֵּי יָדָיו, כְּאִילּוּ הוּא מוֹחֵא לְךָ כַּפַּיִים בַּחֲזָרָה."], ["מתחילים לשיר \"שלום עליכם\"\nמביאים את הסידורים\nמסדרים את הכיסאות", "מַתְחִילִים לָשִׁיר \"שָׁלוֹם עֲלֵיכֶם\"\nמְבִיאִים אֶת הַסִּידּוּרִים\nמְסַדְּרִים אֶת הַכִּיסְאוֹת"], ["ריח של חלות ממלא את הבית.\nאמא עסוקה עם התינוק, אבא מסדר את השולחן — ויש עוד כמה דברים לעשות.\nמה עושים?", "רֵיחַ שֶׁל חַלּוֹת מְמַלֵּא אֶת הַבַּיִת.\nאִמָּא עֲסוּקָה עִם הַתִּינוֹק, אַבָּא מְסַדֵּר אֶת הַשּׁוּלְחָן — וְיֵשׁ עוֹד כַּמָּה דְּבָרִים לַעֲשׂוֹת.\nמָה עוֹשִׂים?"], ["הבית מוכן לשבת. גם אתה עזרת להכניס אליו אור ושמחה.", "הַבַּיִת מוּכָן לְשַׁבָּת. גַּם אַתָּה עָזַרְתָּ לְהַכְנִיס אֵלָיו אוֹר וְשִׂמְחָה."], ["ומה קורה?\n\nמסדרים את הכיסאות.\nאבא מביט בשורה המסודרת: \"עכשיו יש מקום מוכן לכל אחד.\"\n\nמביאים את הסידורים.\nאתה מניח סידור ליד כל מקום. \"איזו הכנה חשובה לשבת,\" אומר אבא.\n\nמתחילים לשיר \"שלום עליכם\".\nאבא מצטרף, אמא מחייכת — ואפילו התינוק נרגע ומקשיב.", "וּמָה קוֹרֶה?\n\nמְסַדְּרִים אֶת הַכִּיסְאוֹת.\nאַבָּא מַבִּיט בַּשּׁוּרָה הַמְּסוּדֶּרֶת: \"עַכְשָׁיו יֵשׁ מָקוֹם מוּכָן לְכָל אֶחָד.\"\n\nמְבִיאִים אֶת הַסִּידּוּרִים.\nאַתָּה מֵנִיחַ סִידּוּר לְיַד כָּל מָקוֹם. \"אֵיזוֹ הֲכָנָה חֲשׁוּבָה לְשַׁבָּת,\" אוֹמֵר אַבָּא.\n\nמַתְחִילִים לָשִׁיר \"שָׁלוֹם עֲלֵיכֶם\".\nאַבָּא מִצְטָרֵף, אִמָּא מְחַיֶּיכֶת — וַאֲפִילּוּ הַתִּינוֹק נִרְגַּע וּמַקְשִׁיב."], ["מתכסים ומנסים לחזור לישון\nמתפללים בלב שהתינוק ירגיש טוב\nמחבקים את הכרית הרכה ומחכים לבוקר", "מִתְכַּסִּים וּמְנַסִּים לַחֲזוֹר לִישׁוֹן\nמִתְפַּלְּלִים בַּלֵּב שֶׁהַתִּינוֹק יַרְגִּישׁ טוֹב\nמְחַבְּקִים אֶת הַכָּרִית הָרַכָּה וּמְחַכִּים לַבּוֹקֶר"], ["הבית חשוך. כולם רוצים לישון.\nואז... \"וואההה!\" התינוק שוב בוכה.\n\nאבא ואמא קמים, וגם אתה מתעורר.\nמה עושים?", "הַבַּיִת חָשׁוּךְ. כּוּלָּם רוֹצִים לִישׁוֹן.\nוְאָז... \"וָואההה!\" הַתִּינוֹק שׁוּב בּוֹכֶה.\n\nאַבָּא וְאִמָּא קָמִים, וְגַם אַתָּה מִתְעוֹרֵר.\nמָה עוֹשִׂים?"], ["ולאט-לאט מגיע השקט. כי גם לילה ארוך... נגמר.", "וּלְאַט-לְאַט מַגִּיעַ הַשֶּׁקֶט. כִּי גַּם לַיְלָה אָרוֹךְ... נִגְמָר."], ["ומה קורה?\n\nמתכסים ומנסים לחזור לישון.\nאתה עוצם עיניים ונושם לאט. הקולות בבית הולכים ונחלשים.\n\nמתפללים בלב שהתינוק ירגיש טוב.\nאתה לוחש תפילה קטנה ומרגיש שהלב נעשה רגוע יותר.\n\nמחבקים את הכרית הרכה ומחכים לבוקר.\nהכרית הרכה צמודה אליך. מעבר לדלת אבא אומר: \"אנחנו כאן. הכול בסדר.\"", "וּמָה קוֹרֶה?\n\nמִתְכַּסִּים וּמְנַסִּים לַחֲזוֹר לִישׁוֹן.\nאַתָּה עוֹצֵם עֵינַיִים וְנוֹשֵׁם לְאַט. הַקּוֹלוֹת בַּבַּיִת הוֹלְכִים וְנֶחֱלָשִׁים.\n\nמִתְפַּלְּלִים בַּלֵּב שֶׁהַתִּינוֹק יַרְגִּישׁ טוֹב.\nאַתָּה לוֹחֵשׁ תְּפִילָּה קְטַנָּה וּמַרְגִּישׁ שֶׁהַלֵּב נַעֲשֶׂה רָגוּעַ יוֹתֵר.\n\nמְחַבְּקִים אֶת הַכָּרִית הָרַכָּה וּמְחַכִּים לַבּוֹקֶר.\nהַכָּרִית הָרַכָּה צְמוּדָה אֵלֶיךָ. מֵעֵבֶר לַדֶּלֶת אַבָּא אוֹמֵר: \"אֲנַחְנוּ כָּאן. הַכּוֹל בְּסֵדֶר.\""], ["נעמדים ליד אבא בגאווה\nשרים עם כולם\nמחייכים אל התינוק", "נֶעֱמָדִים לְיַד אַבָּא בְּגַאֲוָוה\nשָׁרִים עִם כּוּלָּם\nמְחַיְּיכִים אֶל הַתִּינוֹק"], ["הגיע היום הגדול. הברית.\nכולם שרים, כולם שמחים, ואבא מחזיק את התינוק בהתרגשות.\n\nפתאום קוראים לך: \"בוא לעמוד ליד אבא!\"\nמה עושים?", "הִגִּיעַ הַיּוֹם הַגָּדוֹל. הַבְּרִית.\nכּוּלָּם שָׁרִים, כּוּלָּם שְׂמֵחִים, וְאַבָּא מַחֲזִיק אֶת הַתִּינוֹק בְּהִתְרַגְּשׁוּת.\n\nפִּתְאוֹם קוֹרְאִים לְךָ: \"בּוֹא לַעֲמוֹד לְיַד אַבָּא!\"\nמָה עוֹשִׂים?"], ["ואתה מרגיש שגם אתה חלק מהרגע המיוחד הזה.", "וְאַתָּה מַרְגִּישׁ שֶׁגַּם אַתָּה חֵלֶק מֵהָרֶגַע הַמְּיוּחָד הַזֶּה."], ["ומה קורה?\n\nנעמדים ליד אבא בגאווה.\nאבא מניח יד חמה על כתפך. עכשיו עומדים יחד: אבא, התינוק ומענדי האח הגדול.\n\nמחייכים אל התינוק.\nלרגע כל הרעש מסביב נעלם. יש רק את החיוך שלך ואת הפנים הקטנות שלו.\n\nשרים עם כולם.\nהקול שלך מצטרף לשירה, וכולם מפנים לך מקום במעגל.", "וּמָה קוֹרֶה?\n\nנֶעֱמָדִים לְיַד אַבָּא בְּגַאֲוָוה.\nאַבָּא מֵנִיחַ יָד חַמָּה עַל כְּתֵפְךָ. עַכְשָׁיו עוֹמְדִים יַחַד: אַבָּא, הַתִּינוֹק וּמֶענְדִּי הָאָח הַגָּדוֹל.\n\nמְחַיְּיכִים אֶל הַתִּינוֹק.\nלְרֶגַע כָּל הָרַעַשׁ מִסָּבִיב נֶעֱלָם. יֵשׁ רַק אֶת הַחִיּוּךְ שֶׁלְּךָ וְאֶת הַפָּנִים הַקְּטַנּוֹת שֶׁלּוֹ.\n\nשָׁרִים עִם כּוּלָּם.\nהַקּוֹל שֶׁלְּךָ מִצְטָרֵף לַשִּׁירָה, וְכוּלָּם מְפַנִּים לְךָ מָקוֹם בַּמַּעְגָּל."], ["אומרים לו בשקט: \"אני אשמור עליך.\"\nמחייכים אליו בחזרה\nמראים לו צעצוע קטן", "אוֹמְרִים לוֹ בְּשֶׁקֶט: \"אֲנִי אֶשְׁמוֹר עָלֶיךָ.\"\nמְחַיְּיכִים אֵלָיו בַּחֲזָרָה\nמַרְאִים לוֹ צַעֲצוּעַ קָטָן"], ["עברו כמה שבועות. התינוק כבר מכיר את הקול שלך. כשאתה מתקרב לעריסה ואומר \"שלום\" — הוא מסובב אליך את הראש ומחייך.\n\nחיוך אמיתי. במיוחד בשבילך.\nפתאום אתה מבין: הוא לא לקח את המקום שלך. הוא קיבל מקום לידך.\nמה עושים?", "עָבְרוּ כַּמָּה שָׁבוּעוֹת. הַתִּינוֹק כְּבָר מַכִּיר אֶת הַקּוֹל שֶׁלְּךָ. כְּשֶׁאַתָּה מִתְקָרֵב לָעֲרִיסָה וְאוֹמֵר \"שָׁלוֹם\" — הוּא מְסוֹבֵב אֵלֶיךָ אֶת הָרֹאשׁ וּמְחַיֵּיךְ.\n\nחִיּוּךְ אֲמִיתִּי. בִּמְיוּחָד בִּשְׁבִילְךָ.\nפִּתְאוֹם אַתָּה מֵבִין: הוּא לֹא לָקַח אֶת הַמָּקוֹם שֶׁלְּךָ. הוּא קִיבֵּל מָקוֹם לְיָדְךָ.\nמָה עוֹשִׂים?"], ["עכשיו כבר ברור: נולד תינוק קטן — ונולד גם אח גדול.", "עַכְשָׁיו כְּבָר בָּרוּר: נוֹלַד תִּינוֹק קָטָן — וְנוֹלַד גַּם אָח גָּדוֹל."], ["ומה קורה?\n\nמחייכים אליו בחזרה.\nהתינוק מחייך עוד יותר, כאילו חיכה בדיוק לחיוך הזה.\n\nמראים לו צעצוע קטן.\nאתה מזיז את הצעצוע לאט, ועיניו עוקבות אחריו — ואחריך.\n\nאומרים לו בשקט: \"אני אשמור עליך.\"\nאמא שומעת ומחבקת את שניכם: \"אין בעולם אח גדול בדיוק כמוך.\"", "וּמָה קוֹרֶה?\n\nמְחַיְּיכִים אֵלָיו בַּחֲזָרָה.\nהַתִּינוֹק מְחַיֵּיךְ עוֹד יוֹתֵר, כְּאִילּוּ חִיכָּה בְּדִיּוּק לַחִיּוּךְ הַזֶּה.\n\nמַרְאִים לוֹ צַעֲצוּעַ קָטָן.\nאַתָּה מֵזִיז אֶת הַצַּעֲצוּעַ לְאַט, וְעֵינָיו const BOOK_READING=[{"page": 1, "n": "אוֹר הִגִּיעַ אֵלֵינוּ\nסִיפּוּר אִינְטֶרְאַקְטִיבִי עַל תִּינוֹק חָדָשׁ בַּמִּשְׁפָּחָה"}, {"page": 2, "n": "\"בָּרוּךְ הַבָּא!\" אָמַר אַבָּא בְּשִׂמְחָה.\n\"יֵשׁ לָנוּ תִּינוֹק חָדָשׁ בַּבַּיִת.\"\n\nהַלֵּב שֶׁל מֶענְדִּי קָפַץ מִשִּׂמְחָה, אֲבָל יַחַד אִיתּוֹ קָפְצָה גַּם שְׁאֵלָה קְטַנָּה:\n\"וּמָה יִהְיֶה אִיתִּי עַכְשָׁיו?\""}, {"page": 3, "n": "הַיּוֹם הַזֶּה הִתְחִיל כְּמוֹ כָּל יוֹם.\nאֲבָל כְּשֶׁאַבָּא פָּתַח אֶת הַדֶּלֶת — הוּא לֹא נִכְנַס לְבַד.\n\nאִמָּא חִיְּיכָה חִיּוּךְ עָיֵיף וְשָׂמֵחַ.\nבְּיָדֶיהָ הָיְיתָה שְׂמִיכָה לְבָנָה וְרַכָּה, וּמִתּוֹכָהּ הֵצִיץ תִּינוֹק קָטָן."}, {"page": 4, "n": ""}, {"page": 5, "n": "עוֹד לִפְנֵי שֶׁהִסְפִּיק לְהוֹרִיד אֶת הַנַּעֲלַיִים, כּוּלָּם כְּבָר עָמְדוּ סְבִיב הַתִּינוֹק.\n\nאַבָּא. אִמָּא. סַבְתָּא.\nאֲפִילּוּ הַשְּׁכֵנָה יָעֵל אָמְרָה \"מַזָּל טוֹב!\"\n\nוּמֶענְדִּי נִשְׁאַר לְרֶגַע בַּצַּד.\nמָה עוֹשִׂים?\n\nמְחַכִּים בְּשֶׁקֶט\nמוֹשְׁכִים לְאִמָּא בַּעֲדִינוּת בַּשַּׁרְווּל\nנִדְחָקִים מְעַט קָדִימָה כְּדֵי לִרְאוֹת גַּם"}, {"page": 6, "n": "עַכְשָׁיו אַתָּה כְּבָר לֹא עוֹמֵד בַּצַּד. אַתָּה מִתְקָרֵב וְרוֹאֶה פָּנִים קְטַנְטַנּוֹת, מַמָּשׁ מִקָּרוֹב."}, {"page": 7, "n": "וּמָה קוֹרֶה?\n\nנִדְחָקִים מְעַט קָדִימָה כְּדֵי לִרְאוֹת גַּם.\nאַבָּא מַבְחִין בְּךָ וּמְפַנֶּה מָקוֹם: \"בּוֹא, אָח גָּדוֹל סַקְרָן. הַמָּקוֹם הַזֶּה חִיכָּה לְךָ.\"\n\nמְחַכִּים בְּשֶׁקֶט.\nאִמָּא מְרִימָה אֵלֶיךָ מַבָּט חַם: \"רָאִיתִי שֶׁחִיכִּיתָ. עַכְשָׁיו בּוֹא אֵלַיּי.\"\n\nמוֹשְׁכִים לְאִמָּא בַּעֲדִינוּת בַּשַּׁרְווּל.\nאִמָּא מְלַטֶּפֶת אֶת יָדְךָ: \"גַּם אוֹתְךָ אֲנִי צְרִיכָה קָרוֹב.\""}, {"page": 8, "n": ""}, {"page": 9, "n": "בְּדִיּוּק כְּשֶׁאִמָּא מִתְיַישֶּׁבֶת לְשַׂחֵק אִיתְּךָ, הַתִּינוֹק מַתְחִיל לִבְכּוֹת. אִמָּא קָמָה מִיָּד, וְהַמִּשְׂחָק נִשְׁאַר עַל הָרִצְפָּה.\n\nוּפִתְאוֹם מַרְגִּישִׁים בַּלֵּב קְצָת לֹא נָעִים.\nמָה עוֹשִׂים?\n\nמַחְלִיטִים לַעֲזוֹר וּמְבִיאִים שְׂמִיכָה קְטַנָּה\nאוֹמְרִים: \"רָצִיתִי שֶׁתְּשַׂחֲקִי אִיתִּי...\"\nמִתְיַישְּׁבִים קְצָת בַּצַּד"}, {"page": 10, "n": "לֹא תָּמִיד קַל לְחַכּוֹת, אֲבָל קַל יוֹתֵר כְּשֶׁמִּישֶׁהוּ מְחַכֶּה אִיתְּךָ."}, {"page": 11, "n": "וּמָה קוֹרֶה?\n\nאוֹמְרִים: \"רָצִיתִי שֶׁתְּשַׂחֲקִי אִיתִּי...\"\nאִמָּא מִתְכּוֹפֶפֶת וּמְחַבֶּקֶת אוֹתְךָ: \"אֲנִי יוֹדַעַת. נִשְׁמוֹר אֶת הַמִּשְׂחָק בְּדִיּוּק כָּאן וְנַחֲזוֹר אֵלָיו.\"\n\nמַחְלִיטִים לַעֲזוֹר וּמְבִיאִים שְׂמִיכָה קְטַנָּה.\n\"אֵיזֶה עוֹזֵר נִפְלָא,\" מְחַיֶּיכֶת אִמָּא. \"הֵבֵאתָ בְּדִיּוּק מָה שֶׁהָיִינוּ צְרִיכִים.\"\n\nמִתְיַישְּׁבִים קְצָת בַּצַּד.\nאַבָּא מִתְיַישֵּׁב לְיָדְךָ: \"לִפְעָמִים גַּם לִי קָשֶׁה לְחַכּוֹת. נְחַכֶּה יַחַד.\""}, {"page": 12, "n": ""}, {"page": 13, "n": "\"אֵיזֶה תִּינוֹק מָתוֹק!\" \"אֵיזֶה חִיּוּךְ!\"\n\"וְאֵילּוּ לְחָיַיִים!\"\n\nכּוּלָּם מְדַבְּרִים עַל הַתִּינוֹק, וְאַף אֶחָד עֲדַיִין לֹא שָׂם לֵב שֶׁלָּבַשְׁתָּ אֶת הַחוּלְצָה לְבַד.\nמָה עוֹשִׂים?\n\nמְבִיאִים לָאוֹרְחִים עוּגִיּוֹת\nמְסַפְּרִים: \"גַּם אֲנִי הִתְלַבַּשְׁתִּי לְבַד!\"\nמַרְגִּישִׁים קְצָת קִנְאָה"}, {"page": 14, "n": "פִּתְאוֹם כּוּלָּם מַבִּיטִים גַּם בַּחוּלְצָה, גַּם בְּעֶזְרָה — וּבְעִיקָּר בְּךָ."}, {"page": 15, "n": "וּמָה קוֹרֶה?\n\nמְסַפְּרִים: \"גַּם אֲנִי הִתְלַבַּשְׁתִּי לְבַד!\"\nאַבָּא מִסְתּוֹבֵב אֵלֶיךָ בְּגַאֲוָוה: \"בֶּאֱמֶת? זֶה הֶישֵּׂג שֶׁל יֶלֶד גָּדוֹל!\"\n\nמַרְגִּישִׁים קְצָת קִנְאָה.\nאִמָּא מַבְחִינָה בַּפָּנִים שֶׁלְּךָ וְלוֹחֶשֶׁת: \"לִפְעָמִים רוֹצִים שֶׁיִּרְאוּ גַּם אוֹתָנוּ. יֵשׁ בַּלֵּב שֶׁלִּי מָקוֹם לִשְׁנֵיכֶם.\"\n\nמְבִיאִים לָאוֹרְחִים עוּגִיּוֹת.\nסַבְתָּא לוֹקַחַת עוּגִיָּיה וְקוֹרֶצֶת: \"יֵשׁ כָּאן גַּם אָח גָּדוֹל מָתוֹק בִּמְיוּחָד.\""}, {"page": 16, "n": ""}, {"page": 17, "n": "פִּתְאוֹם הַתִּינוֹק עוֹשֶׂה פַּרְצוּף מַצְחִיק. הוּא מְכַוֵּוץ אֶת הָאַף, מְנַפֵּחַ אֶת הַלְּחָיַיִים וּפוֹתֵחַ פֶּה קָטָן.\nכּוּלָּם מְחַכִּים.\nוְאָז... פִּיהוּק גָּדוֹל!\n\nאַבָּא מֵרִים גַּבָּה: \"נִרְאֶה שֶׁיֵּשׁ לוֹ כְּבָר מָה לוֹמַר!\"\nכּוּלָּם פּוֹרְצִים בִּצְחוֹק.\nמָה עוֹשִׂים?\n\nצוֹחֲקִים יַחַד\nעוֹשִׂים פַּרְצוּף מַצְחִיק אֲפִילּוּ יוֹתֵר\nמוֹחֲאִים כַּפַּיִים לַתִּינוֹק"}, {"page": 18, "n": "לִפְעָמִים תִּינוֹק קָטָן מֵבִיא אִיתּוֹ לַבַּיִת צְחוֹק גָּדוֹל."}, {"page": 19, "n": "וּמָה קוֹרֶה?\n\nצוֹחֲקִים יַחַד.\nהַצְּחוֹק שֶׁלְּךָ מִתְגַּלְגֵּל בְּכָל הַחֶדֶר, וְהַתִּינוֹק מְמַצְמֵץ בְּהַפְתָּעָה.\n\nעוֹשִׂים פַּרְצוּף מַצְחִיק אֲפִילּוּ יוֹתֵר.\nעַכְשָׁיו כּוּלָּם צוֹחֲקִים גַּם מֵהַפַּרְצוּף שֶׁלְּךָ.\nלְרֶגַע אַתָּה וְהַתִּינוֹק צֶוֶות שֶׁל מַצְחִיקִים.\n\nמוֹחֲאִים כַּפַּיִים לַתִּינוֹק.\nהַתִּינוֹק מֵזִיז אֶת שְׁתֵּי יָדָיו, כְּאִילּוּ הוּא מוֹחֵא לְךָ כַּפַּיִים בַּחֲזָרָה."}, {"page": 20, "n": "מַתְחִילִים לָשִׁיר \"שָׁלוֹם עֲלֵיכֶם\"\nמְבִיאִים אֶת הַסִּידּוּרִים\nמְסַדְּרִים אֶת הַכִּיסְאוֹת"}, {"page": 21, "n": "רֵיחַ שֶׁל חַלּוֹת מְמַלֵּא אֶת הַבַּיִת.\nאִמָּא עֲסוּקָה עִם הַתִּינוֹק, אַבָּא מְסַדֵּר אֶת הַשּׁוּלְחָן — וְיֵשׁ עוֹד כַּמָּה דְּבָרִים לַעֲשׂוֹת.\nמָה עוֹשִׂים?"}, {"page": 22, "n": "הַבַּיִת מוּכָן לְשַׁבָּת. גַּם אַתָּה עָזַרְתָּ לְהַכְנִיס אֵלָיו אוֹר וְשִׂמְחָה."}, {"page": 23, "n": "וּמָה קוֹרֶה?\n\nמְסַדְּרִים אֶת הַכִּיסְאוֹת.\nאַבָּא מַבִּיט בַּשּׁוּרָה הַמְּסוּדֶּרֶת: \"עַכְשָׁיו יֵשׁ מָקוֹם מוּכָן לְכָל אֶחָד.\"\n\nמְבִיאִים אֶת הַסִּידּוּרִים.\nאַתָּה מֵנִיחַ סִידּוּר לְיַד כָּל מָקוֹם. \"אֵיזוֹ הֲכָנָה חֲשׁוּבָה לְשַׁבָּת,\" אוֹמֵר אַבָּא.\n\nמַתְחִילִים לָשִׁיר \"שָׁלוֹם עֲלֵיכֶם\".\nאַבָּא מִצְטָרֵף, אִמָּא מְחַיֶּיכֶת — וַאֲפִילּוּ הַתִּינוֹק נִרְגַּע וּמַקְשִׁיב."}, {"page": 24, "n": "מִתְכַּסִּים וּמְנַסִּים לַחֲזוֹר לִישׁוֹן\nמִתְפַּלְּלִים בַּלֵּב שֶׁהַתִּינוֹק יַרְגִּישׁ טוֹב\nמְחַבְּקִים אֶת הַכָּרִית הָרַכָּה וּמְחַכִּים לַבּוֹקֶר"}, {"page": 25, "n": "הַבַּיִת חָשׁוּךְ. כּוּלָּם רוֹצִים לִישׁוֹן.\nוְאָז... \"וָואההה!\" הַתִּינוֹק שׁוּב בּוֹכֶה.\n\nאַבָּא וְאִמָּא קָמִים, וְגַם אַתָּה מִתְעוֹרֵר.\nמָה עוֹשִׂים?"}, {"page": 26, "n": "וּלְאַט-לְאַט מַגִּיעַ הַשֶּׁקֶט. כִּי גַּם לַיְלָה אָרוֹךְ... נִגְמָר."}, {"page": 27, "n": "וּמָה קוֹרֶה?\n\nמִתְכַּסִּים וּמְנַסִּים לַחֲזוֹר לִישׁוֹן.\nאַתָּה עוֹצֵם עֵינַיִים וְנוֹשֵׁם לְאַט. הַקּוֹלוֹת בַּבַּיִת הוֹלְכִים וְנֶחֱלָשִׁים.\n\nמִתְפַּלְּלִים בַּלֵּב שֶׁהַתִּינוֹק יַרְגִּישׁ טוֹב.\nאַתָּה לוֹחֵשׁ תְּפִילָּה קְטַנָּה וּמַרְגִּישׁ שֶׁהַלֵּב נַעֲשֶׂה רָגוּעַ יוֹתֵר.\n\nמְחַבְּקִים אֶת הַכָּרִית הָרַכָּה וּמְחַכִּים לַבּוֹקֶר.\nהַכָּרִית הָרַכָּה צְמוּדָה אֵלֶיךָ. מֵעֵבֶר לַדֶּלֶת אַבָּא אוֹמֵר: \"אֲנַחְנוּ כָּאן. הַכּוֹל בְּסֵדֶר.\""}, {"page": 28, "n": "נֶעֱמָדִים לְיַד אַבָּא בְּגַאֲוָוה\nשָׁרִים עִם כּוּלָּם\nמְחַיְּיכִים אֶל הַתִּינוֹק"}, {"page": 29, "n": "הִגִּיעַ הַיּוֹם הַגָּדוֹל. הַבְּרִית.\nכּוּלָּם שָׁרִים, כּוּלָּם שְׂמֵחִים, וְאַבָּא מַחֲזִיק אֶת הַתִּינוֹק בְּהִתְרַגְּשׁוּת.\n\nפִּתְאוֹם קוֹרְאִים לְךָ: \"בּוֹא לַעֲמוֹד לְיַד אַבָּא!\"\nמָה עוֹשִׂים?"}, {"page": 30, "n": "וְאַתָּה מַרְגִּישׁ שֶׁגַּם אַתָּה חֵלֶק מֵהָרֶגַע הַמְּיוּחָד הַזֶּה."}, {"page": 31, "n": "וּמָה קוֹרֶה?\n\nנֶעֱמָדִים לְיַד אַבָּא בְּגַאֲוָוה.\nאַבָּא מֵנִיחַ יָד חַמָּה עַל כְּתֵפְךָ. עַכְשָׁיו עוֹמְדִים יַחַד: אַבָּא, הַתִּינוֹק וּמֶענְדִּי הָאָח הַגָּדוֹל.\n\nמְחַיְּיכִים אֶל הַתִּינוֹק.\nלְרֶגַע כָּל הָרַעַשׁ מִסָּבִיב נֶעֱלָם. יֵשׁ רַק אֶת הַחִיּוּךְ שֶׁלְּךָ וְאֶת הַפָּנִים הַקְּטַנּוֹת שֶׁלּוֹ.\n\nשָׁרִים עִם כּוּלָּם.\nהַקּוֹל שֶׁלְּךָ מִצְטָרֵף לַשִּׁירָה, וְכוּלָּם מְפַנִּים לְךָ מָקוֹם בַּמַּעְגָּל."}, {"page": 32, "n": "אוֹמְרִים לוֹ בְּשֶׁקֶט: \"אֲנִי אֶשְׁמוֹר עָלֶיךָ.\"\nמְחַיְּיכִים אֵלָיו בַּחֲזָרָה\nמַרְאִים לוֹ צַעֲצוּעַ קָטָן"}, {"page": 33, "n": "עָבְרוּ כַּמָּה שָׁבוּעוֹת. הַתִּינוֹק כְּבָר מַכִּיר אֶת הַקּוֹל שֶׁלְּךָ. כְּשֶׁאַתָּה מִתְקָרֵב לָעֲרִיסָה וְאוֹמֵר \"שָׁלוֹם\" — הוּא מְסוֹבֵב אֵלֶיךָ אֶת הָרֹאשׁ וּמְחַיֵּיךְ.\n\nחִיּוּךְ אֲמִיתִּי. בִּמְיוּחָד בִּשְׁבִילְךָ.\nפִּתְאוֹם אַתָּה מֵבִין: הוּא לֹא לָקַח אֶת הַמָּקוֹם שֶׁלְּךָ. הוּא קִיבֵּל מָקוֹם לְיָדְךָ.\nמָה עוֹשִׂים?"}, {"page": 34, "n": "עַכְשָׁיו כְּבָר בָּרוּר: נוֹלַד תִּינוֹק קָטָן — וְנוֹלַד גַּם אָח גָּדוֹל."}, {"page": 35, "n": "וּמָה קוֹרֶה?\n\nמְחַיְּיכִים אֵלָיו בַּחֲזָרָה.\nהַתִּינוֹק מְחַיֵּיךְ עוֹד יוֹתֵר, כְּאִילּוּ חִיכָּה בְּדִיּוּק לַחִיּוּךְ הַזֶּה.\n\nמַרְאִים לוֹ צַעֲצוּעַ קָטָן.\nאַתָּה מֵזִיז אֶת הַצַּעֲצוּעַ לְאַט, וְעֵינָיו עוֹקְבוֹת אַחֲרָיו — וְאַחֲרֶיךָ.\n\nאוֹמְרִים לוֹ בְּשֶׁקֶט: \"אֲנִי אֶשְׁמוֹר עָלֶיךָ.\"\nאִמָּא שׁוֹמַעַת וּמְחַבֶּקֶת אֶת שְׁנֵיכֶם: \"אֵין בָּעוֹלָם אָח גָּדוֹל בְּדִיּוּק כָּמוֹךָ.\""}, {"page": 36, "n": "לִהְיוֹת אָח גָּדוֹל לֹא אוֹמֵר שֶׁתָּמִיד קַל.\nלִפְעָמִים מְחַכִּים. לִפְעָמִים מְקַנְּאִים.\nלִפְעָמִים רוֹצִים שֶׁגַּם אוֹתָנוּ יִרְאוּ.\n\nוְלִפְעָמִים צוֹחֲקִים יַחַד, עוֹזְרִים קְצָת וּמְגַלִּים שֶׁמִּישֶׁהוּ קָטָן כְּבָר מַכִּיר אֶת הַקּוֹל שֶׁלָּנוּ."}, {"page": 37, "n": "בְּכָל יוֹם הַלֵּב גָּדֵל עוֹד קְצָת.\nוְיוֹם אֶחָד מְגַלִּים אֶת הַסּוֹד הַגָּדוֹל:\nכְּשֶׁנוֹלַד תִּינוֹק חָדָשׁ בַּמִּשְׁפָּחָה, לֹא מְחַלְּקִים אֶת הָאַהֲבָה לְפָחוֹת חֲלָקִים.\nהַלֵּב פָּשׁוּט גָּדֵל — וְיֵשׁ בּוֹ מָקוֹם לְכוּלָּם."}, {"page": 38, "n": "גַּם אֶצְלִי הַלֵּב גָּדֵל\nצַיְּירוּ מַשֶּׁהוּ שֶׁאַתֶּם אוֹהֲבִים לַעֲשׂוֹת יַחַד בַּמִּשְׁפָּחָה"}, {"page": 39, "n": "מְדַבְּרִים יַחַד\n\nמָה הִרְגִּישׁ מֶענְדִּי בִּתְחִילַּת הַסִּיפּוּר?\n\nאֵיזוֹ בְּחִירָה בַּסִּיפּוּר הֲכִי מָצְאָה חֵן בְּעֵינֶיךָ?\n\nמָה יָכוֹל לַעֲזוֹר כְּשֶׁקָּשֶׁה לְחַכּוֹת?"}, {"page": 40, "n": "כָּל הַזְּכוּיוֹת שְׁמוּרוֹת"}];
/* The original forty image pages remain the source. This is an additional text view. */
(() => {
  const d=document.createElement('dialog');d.id='bookReaderDialog';d.setAttribute('aria-labelledby','bookReaderTitle');
  d.innerHTML='<div class="dialog-top"><h2 id="bookReaderTitle">אור הגיע אלינו</h2><button type="button" class="close" id="bookReaderClose" aria-label="סגירה">×</button></div><div class="book-reading-layout"><img id="bookReaderImage" alt="עמוד הספר המקורי"><div class="book-reading-text" id="bookReaderText"></div></div><div class="book-reading-nav"><button type="button" class="btn" id="bookReaderPrev">→ עמוד קודם</button><span id="bookReaderCount" dir="ltr"></span><button type="button" class="btn primary" id="bookReaderNext">עמוד הבא ←</button></div>';
  document.body.append(d);const launch=document.createElement('button');launch.className='btn';launch.id='bookRead';launch.textContent='אָ קוראים עם ניקוד';bBar.append(launch);
  function paint(){
    document.getElementById('bookReaderImage').src=PAGES[p];
    document.getElementById('bookReaderImage').alt='עמוד '+(p+1)+' בספר המקורי';
    document.getElementById('bookReaderCount').textContent=(p+1)+' / '+PAGES.length;
    const text=BOOK_READING[p].n;
    document.getElementById('bookReaderText').textContent=text||(PlayReading.enabled?'בָּעַמּוּד הַזֶּה יֵשׁ אִיּוּר. אֶפְשָׁר לְהִסְתַּכֵּל וּלְהַמְשִׁיךְ.':'בעמוד הזה יש איור. אפשר להסתכל ולהמשיך.');
    document.getElementById('bookReaderPrev').disabled=p===0;
    document.getElementById('bookReaderNext').disabled=p===PAGES.length-1;
    d.scrollTop=0;
  }
  launch.onclick=()=>{paint();d.showModal()};document.getElementById('bookReaderClose').onclick=()=>d.close();
  document.getElementById('bookReaderPrev').onclick=()=>{goPrev();paint()};document.getElementById('bookReaderNext').onclick=()=>{goNext();paint()};
  d.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowLeft'&&p<PAGES.length-1){e.preventDefault();goNext();paint()}if(e.key==='ArrowRight'&&p>0){e.preventDefault();goPrev();paint()}e.stopPropagation()});
  window.addEventListener('morash-reading-change',()=>{if(d.open)paint()});
})();
