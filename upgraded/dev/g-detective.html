<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בלש המידות · תיק המתנה</title><style>/* THEME */
body{--teal:#647a63;--teal-dark:#34594f;--cream:#fbf5e7;background:#fbf5e7}.hero{grid-template-columns:1.15fr 1fr}.hero h1{font-size:clamp(42px,5.3vw,72px)}.folder-art{position:relative;min-height:270px;display:grid;place-items:center;background:radial-gradient(ellipse,#e1dac3 0,transparent 65%)}.folder{width:300px;height:205px;border-radius:10px 18px 18px 18px;transform:rotate(-8deg);background:#d2ac63;box-shadow:0 20px 25px #42371926;border-top:20px solid #b08f50;display:grid;place-items:center}.folder:before{content:'';position:absolute;right:0;top:-39px;width:120px;height:28px;background:#b08f50;border-radius:13px 13px 0 0}.paper{background:#fffdf5;padding:22px 35px;box-shadow:0 5px 10px #604e251c;transform:rotate(3deg);text-align:center}.paper b{font-size:34px;display:block}.seal{position:absolute;left:20px;bottom:10px;border:4px double #a44835;color:#a44835;border-radius:50%;width:90px;height:90px;display:grid;place-items:center;transform:rotate(16deg);font-weight:900;background:#fff2dc}.casebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}.scene{position:relative;border-radius:28px;overflow:hidden;background:#dedfc6;border:8px solid white;box-shadow:var(--shadow);aspect-ratio:1.9}.scene svg{display:block;width:100%;height:100%}.clue{position:absolute;background:transparent;border:2px dashed transparent;border-radius:20px;width:10%;height:18%;font-size:clamp(23px,4vw,47px);transition:.2s}.scene.guided .clue{border-color:#efc760;box-shadow:0 0 0 7px #fff9dd70;background:#fff4be55;animation:clueglow 1.3s infinite alternate}.clue.found{background:#e2eddaaa!important;border-color:#5c8f71!important;animation:none!important}.clue.found:after{content:'✓';position:absolute;font-size:16px;background:#396a5a;color:white;border-radius:50%;width:25px;height:25px;left:-4px;top:-4px}@keyframes clueglow{to{box-shadow:0 0 0 12px #fff9dd20}}.board{margin-top:28px;background:radial-gradient(#a4834826 1px,transparent 1px),#e1cda4;background-size:7px 7px;border:10px solid #bd9d68;border-radius:28px;padding:24px}.board-head{display:flex;justify-content:space-between;align-items:center;gap:18px}.evidence-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.evidence{background:#fffdf6;border:0;padding:25px 15px 18px;border-radius:4px;box-shadow:0 6px 8px #795e2920;position:relative;text-align:right;transform:rotate(var(--tilt));min-height:200px}.evidence:before{content:'';position:absolute;top:-6px;right:calc(50% - 23px);width:46px;height:19px;background:#d8e8dabf;transform:rotate(5deg)}.portrait{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:29px;background:#e4ead8;margin-bottom:12px}.evidence h3{font-size:17px;margin-bottom:7px}.evidence .snippet{font-size:12px;line-height:1.6;color:#6a7669;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.evidence.locked{background:#eeddba;box-shadow:none;transform:none;border:2px dashed #bca173;text-align:center;color:#846b45}.badge{font-size:11px;background:#dce8d4;color:#3b6648;border-radius:5px;padding:4px 8px;display:inline-block}.quote{font-size:22px;line-height:1.85;margin:18px 0}.decision{display:grid;grid-template-columns:1fr 1fr;gap:10px}.decision button.selected{background:#34594f;color:white;box-shadow:0 0 0 3px #adcdb9}.story{font-size:18px;line-height:1.95}.case-end{text-align:center;padding:30px}.stamp{font-size:44px;color:#2f7365;border:5px double #2f7365;padding:5px 30px;transform:rotate(-8deg);display:inline-block;margin:20px}.notebook{max-width:850px;margin:auto}.hintrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.scoreline{font-weight:800;color:#7b5c27}.final-note{font-size:24px;line-height:1.8}.chapter{font-size:12px;letter-spacing:.06em;color:#786341;font-weight:800}@media(max-width:750px){.hero{grid-template-columns:1fr}.folder-art{display:none}.evidence-grid{grid-template-columns:1fr 1fr}.board{padding:17px;border-width:6px}.evidence{min-height:180px;padding:20px 12px 14px}.scene{aspect-ratio:1.3}.scene svg{object-fit:cover}.quote{font-size:19px}.clue{width:14%;height:18%;font-size:29px}.decision{grid-template-columns:1fr}.casebar{margin-top:6px}}
</style><body><header class="brandbar"><span class="brandmark">הבאת ברכה ✦</span><span class="brandnote">חלק ז׳ · בלש המידות</span><span class="tag">תיק חקירה 01</span></header><main class="shell"><section class="hero"><div><span class="eyebrow">נכנסים לחדר. מחברים את העדויות.</span><h1>מה באמת<br>קרה <span style="color:#b7803d">למתנה?</span></h1><p id="intro"></p><div class="toolbar"><button class="btn primary" id="storyOpen">פותחים את תיק החקירה</button><label class="chip">מסלול <select id="level" aria-label="מסלול חקירה"><option value="1">בלשים צעירים · עם סימון</option><option value="2">בלשים עצמאיים · בלי סימון</option></select></label></div></div><div class="folder-art"><div class="folder"><div class="paper"><span>בלש המידות</span><b>תיק המתנה</b><span>4 עדויות · אמת אחת</span></div><span class="seal">לחקירה!</span></div></div></section><div class="casebar"><div><span class="chapter">01 / סורקים את החדר</span><h2 style="margin:4px 0">משהו מסתתר כאן</h2><span class="muted">מצאו ארבעה סימנים בחדר. כל סימן פותח עדות בלוח החקירה.</span></div><span class="scoreline" id="score"></span></div><div class="scene" id="scene"><svg viewBox="0 0 900 450" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="wall" width="35" height="35" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="2" fill="#bdc9b4"/></pattern></defs><rect width="900" height="450" fill="#dce3d0"/><rect width="900" height="325" fill="url(#wall)"/><path d="M0 325h900v125H0" fill="#c1aa87"/><path d="M0 355h900M0 405h900M100 325l-30 125M300 325l-20 125M500 325v125M700 325l25 125" stroke="#a68c6844" stroke-width="2"/><rect x="76" y="40" width="190" height="235" rx="15" fill="#f4eedb"/><rect x="91" y="54" width="160" height="205" rx="8" fill="#afcfce"/><path d="M171 54v205M91 155h160" stroke="#f4eedb" stroke-width="10"/><rect x="650" y="36" width="200" height="293" rx="12" fill="#869886"/><rect x="670" y="55" width="160" height="260" rx="8" fill="#adba9d"/><circle cx="695" cy="185" r="7" fill="#d8b768"/><rect x="303" y="150" width="302" height="23" rx="8" fill="#9e8667"/><rect x="330" y="95" width="23" height="55" rx="3" fill="#6d978c"/><rect x="356" y="106" width="29" height="44" rx="3" fill="#e3b26f"/><rect x="389" y="83" width="20" height="67" rx="3" fill="#a5b1c1"/><circle cx="530" cy="113" r="29" fill="#f3efda" stroke="#b09c6d" stroke-width="5"/><path d="M530 95v19l14 5" stroke="#68776c" stroke-width="4" fill="none"/><path d="M314 287l-15 112M594 287l15 112" stroke="#8f7355" stroke-width="18"/><rect x="286" y="255" width="338" height="34" rx="8" fill="#b18f68"/><rect x="406" y="220" width="87" height="34" rx="4" fill="#e5b088"/><path d="M437 220v34" stroke="#ca795f" stroke-width="12"/><path d="M442 218q-36-39-32-3l32 8q43-39 44-9l-42 10" fill="none" stroke="#ca795f" stroke-width="7"/><ellipse cx="502" cy="386" rx="173" ry="45" fill="#d9d4ad"/><path d="M434 345l45 18-27 35-38-19zM552 347l-17 28 45 14 24-29z" fill="#d6a887"/><rect x="69" y="304" width="118" height="85" rx="15" fill="#779991"/><rect x="60" y="288" width="135" height="36" rx="12" fill="#8faca1"/><circle cx="342" cy="375" r="7" fill="#cf8973"/><circle cx="389" cy="412" r="6" fill="#799f95"/><circle cx="598" cy="410" r="8" fill="#cea957"/></svg><div id="clues"></div></div><section class="board"><div class="board-head"><div><span class="chapter">02 / לוח החקירה</span><h2>שומעים את כל הצדדים</h2></div><span class="tag" id="count"></span></div><div class="evidence-grid" id="evidence"></div><div class="hintrow" style="margin-top:24px"><button class="btn primary" id="solve">מחברים את העדויות</button><button class="btn" id="hint">צריכים רמז?</button><span id="feedback" class="feedback" aria-live="polite"></span></div></section><footer class="footer"><button class="btn" id="restart">חקירה חדשה</button></footer></main><dialog id="dialog"><div class="dialog-top"><h2 id="dialogTitle"></h2><button id="close" class="close" aria-label="סגירה">×</button></div><div id="body"></div></dialog><script>/* UI */</script><script>
/* CONTENT */
const U=PlayUI,$=s=>document.querySelector(s),KEY='morash-detective-v1';let data=U.read(KEY,{found:[],answers:{},level:1,won:false});if(!Array.isArray(data.found)||!data.answers)data={found:[],answers:{},level:1,won:false};
const symbols=['🧵','✂','🚪','🔎'],portraits=['🎀','✂','🚪','🌷'],places=[[47,73],[60,45],[77,39],[32,80]];$('#intro').textContent=CONTENT.intro;
function save(){U.save(KEY,data)}
function render(){$('#level').value=data.level;$('#scene').classList.toggle('guided',data.level===1);$('#score').textContent=(data.found.length*50+(data.won?300:0))+' נקודות חקירה';$('#count').textContent=data.found.length+' / 4 עדויות';$('#clues').innerHTML=places.map((p,i)=>`<button class="clue ${data.found.includes(i)?'found':''}" data-clue="${i}" aria-label="בדיקת סימן ${i+1}" style="left:${p[0]}%;top:${p[1]}%">${symbols[i]}</button>`).join('');$('#evidence').innerHTML=CONTENT.witnesses.map((w,i)=>data.found.includes(i)?`<button class="evidence" data-witness="${i}" style="--tilt:${[-2,1,-1,2][i]}deg"><span class="portrait">${portraits[i]}</span><h3>${U.escape(w.name)}</h3><span class="snippet">${U.escape(w.text)}</span><span class="badge">${data.answers[i]===undefined?'לעדות המלאה':'סיווג נשמר ✓'}</span></button>`:`<div class="evidence locked"><div class="portrait" style="margin:0 auto 12px">?</div><h3>עדות ${i+1}</h3><small>מוצאים סימן בחדר</small></div>`).join('');$('#solve').textContent=data.won?'התיק פוענח · לצפייה':'מחברים את העדויות'}
function show(title,html){$('#dialogTitle').textContent=title;$('#body').innerHTML=html;U.dialog('dialog')}
function witness(i){const w=CONTENT.witnesses[i];show(w.name,`<span class="stage-chip">עדות ${i+1}</span><p class="quote">${U.escape(w.text)}</p><p class="muted">איך תסווגו את העדות? תוכלו לשנות את הבחירה אחרי שתשמעו את כולם.</p><div class="decision"><button class="btn ${data.answers[i]===true?'selected':''}" data-decision="true">אמיתי</button><button class="btn ${data.answers[i]===false?'selected':''}" data-decision="false">מטעה</button></div><p class="feedback" id="saved" aria-live="polite"></p>`);$('.decision').onclick=e=>{const b=e.target.closest('[data-decision]');if(!b)return;data.answers[i]=b.dataset.decision==='true';save();render();$('.decision').querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));$('#saved').textContent='הבחירה נשמרה בלוח החקירה';}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-clue],[data-witness]');if(!b)return;const i=+(b.dataset.clue??b.dataset.witness);if(!data.found.includes(i)){data.found.push(i);save();render();U.celebrate();U.toast('עדות חדשה נפתחה · 50 נקודות')}witness(i)});
$('#storyOpen').onclick=()=>show('תיק המתנה',`<p class="story">${U.escape(CONTENT.story)}</p><button class="btn primary" id="begin">יוצאים לחקירה</button>`);$('#body').addEventListener('click',e=>{if(e.target.id==='begin')$('#dialog').close()});$('#close').onclick=()=>$('#dialog').close();$('#level').onchange=e=>{data.level=+e.target.value;save();render()};$('#hint').onclick=()=>show('רמז לחקירה',`<p class="quote">${U.escape(CONTENT.hint)}</p>`);
$('#solve').onclick=()=>{if(data.found.length<4){$('#feedback').textContent='עוד '+(4-data.found.length)+' עדויות מסתתרות בחדר';return}if(Object.keys(data.answers).length<4){$('#feedback').textContent='פתחו כל עדות ובחרו: אמיתי או מטעה';return}const correct=CONTENT.witnesses.filter((w,i)=>data.answers[i]===w.true).length;if(correct<4){$('#feedback').textContent='חלק מהעדויות עדיין לא במקום. חזרו ללוח ונסו לחבר שוב.';show('מסתכלים שוב',`<p class="quote">${U.escape(CONTENT.hint)}</p><p class="muted">אפשר לשנות כל סיווג בלוח החקירה. הנקודות שאספתם נשארות שלכם.</p>`);return}data.won=true;save();render();U.celebrate();show('התיק פוענח!',`<div class="case-end"><div class="stamp">פוענח!</div><p class="final-note">${U.escape(CONTENT.win)}</p><span class="tag">בונוס פענוח · 300 נקודות</span></div>`)};
$('#restart').onclick=()=>{if(confirm('לפתוח חקירה חדשה ולאפס את ההתקדמות במשחק הזה?')){data={found:[],answers:{},level:data.level,won:false};save();render();$('#feedback').textContent=''}};render();
</script></body></html>
