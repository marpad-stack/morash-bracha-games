<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בית המצוות · הרפתקת האותיות</title><style>/* THEME */
.house{position:relative;aspect-ratio:1.25;border-radius:36px;overflow:hidden;background:#e5eee1;border:10px solid #fffdf7;box-shadow:0 20px 80px #20454315}.house svg{width:100%;height:100%;display:block}.hotspot{position:absolute;border:4px solid #fff9e5;border-radius:23px;background:#fff3c5;box-shadow:0 6px 0 #c3ae7944,0 0 0 8px #ffffff50;width:64px;height:68px;font-size:31px;transform:translate(50%,-50%);transition:.2s}.hotspot:hover{scale:1.1}.hotspot.done{background:#b5ddd0}.hotspot.done:after{content:'✓';position:absolute;bottom:-8px;right:-8px;font:800 16px Heebo;background:#176d66;color:white;width:26px;height:26px;border-radius:50%}.letterbag{display:flex;gap:9px;justify-content:center;margin:24px 0}.letter{width:48px;height:58px;border:2px dashed #cdbf9f;border-radius:13px;background:#f3ecd9;display:grid;place-items:center;font-size:30px;font-weight:900}.letter.earned{background:#f7d574;border:2px solid #d8ad47;box-shadow:0 4px 0 #d8ad47}.subhero{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:10px 0 22px}.arena{position:relative;height:320px;border-radius:22px;background:radial-gradient(ellipse at bottom,#c8e4d4,transparent 70%),#edf5ee;overflow:hidden;direction:ltr;margin-top:18px;border:1px solid #d3dfd3}.target{position:absolute;font-size:34px;width:62px;height:62px;border:3px solid white;border-radius:50%;background:#f6d06f;box-shadow:0 5px 0 #947c4330;animation:float 2s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(25px) rotate(8deg)}}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.cards button{border:0;background:#247d7b;color:white;border-radius:18px;min-height:78px;font-size:30px;box-shadow:0 5px 0 #155c5d}.cards button.up{background:#f6d477;color:#263f40}.cards button.matched{background:#cae6d9;color:#235e51;box-shadow:none}.sequence{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:22px 0}.sequence button{height:110px;border:5px solid white;border-radius:25px;font-size:35px;opacity:.65;box-shadow:0 5px 0 #27423d16}.sequence button.lit{opacity:1;scale:1.04;box-shadow:0 0 25px #e8bf4d}.tiles{display:grid;gap:8px;direction:ltr;margin:20px auto;max-width:390px}.tiles button{aspect-ratio:1;border:3px solid #fff;border-radius:15px;font-size:32px;background:#248d89;color:white;box-shadow:0 4px 0 #175956}.tiles button.blank{background:#dbeade;box-shadow:none;border-style:dashed;color:transparent}.tiles button.placed{background:#f3c873;color:#31534e}.challenge-label{color:#54736a;text-align:center}.riddle{font-size:24px;text-align:center;line-height:1.75;margin:20px auto;max-width:560px}.reward{text-align:center;padding:24px}.reward .big{font-size:85px;color:#bc892a;font-weight:900}.stage-chip{padding:5px 10px;border-radius:20px;background:#e1ece5;font-size:12px;display:inline-block;margin:8px 0}.finalpool{display:flex;gap:10px;justify-content:center;margin:18px 0}.finalpool button{font-size:30px;width:50px;height:60px;border:0;background:#f7d574;border-radius:12px}.finalpool button:disabled{visibility:hidden}.maplist{display:flex;flex-wrap:wrap;gap:8px}.maplist button{font-size:13px;padding:8px 13px;border-radius:30px;border:1px solid #c8d9cc;background:#fff9ec}.hero .instruction{color:#274e49;font-size:17px}.tiny{font-size:12px;color:#788078}@media(max-width:700px){.house{order:-1}.hotspot{width:49px;height:53px;font-size:26px;border-width:3px;border-radius:17px}.hero h1{font-size:43px}.hero{gap:24px}.cards{gap:8px}.cards button{min-height:68px}.riddle{font-size:21px}.subhero{align-items:flex-start;flex-wrap:wrap}.arena{height:300px}.letter{width:42px;height:51px}}
</style><body><header class="brandbar"><span class="brandmark">מורֶה שמים <span style="color:var(--coral)">✦</span></span><span class="brandnote">הבאת ברכה · חלק ג׳</span><span class="tag">הרפתקה בבית</span></header><main class="shell"><div class="subhero"><div class="toolbar"><label class="chip">רמה <select id="level" aria-label="רמת משחק"><option value="1">צעדים ראשונים · 4+</option><option value="2">הרפתקנים · 7+</option><option value="3">אלופים · 10+</option></select></label><button class="btn" id="nikud">ניקוד אותיות</button></div><div class="toolbar"><div class="stat"><b id="score">0</b><span>נקודות</span></div><div class="stat"><b id="found" dir="ltr">0 / 5</b><span>אותיות בכיס</span></div></div></div><section class="hero"><div><span class="eyebrow">5 חפצים · 5 אתגרים · מילה סודית אחת</span><h1>כל הבית<br><span style="color:var(--teal)">הרפתקה!</span></h1><p class="instruction">בוחרים חפץ בבית, משחקים באתגר שלו ופותרים חידה. כל הצלחה פותחת אות חדשה. אספתם את כולן? פותחים את התיבה!</p><div class="maplist" id="maplist"></div><div class="letterbag" id="bag"></div><button class="btn coral" id="chest">🔒 התיבה מחכה לאותיות</button><p class="tiny" style="margin-top:18px">ההתקדמות נשמרת במכשיר הזה. אפשר לחזור לכל אתגר ולשחק שוב.</p></div><div class="house"><svg viewBox="0 0 640 510" aria-hidden="true"><defs><pattern id="wall" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M13 9v8M9 13h8" stroke="#ccdbc9" stroke-width="1"/></pattern><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#a8d7d9"/><stop offset="1" stop-color="#e9f0d5"/></linearGradient></defs><rect width="640" height="510" fill="#e9eedb"/><rect width="640" height="370" fill="url(#wall)"/><path d="M0 368h640v142H0" fill="#caa983"/><path d="M0 402h640M0 452h640M80 368L0 510M230 368l-40 142M410 368l40 142M560 368l80 142" stroke="#b291703b" stroke-width="3"/><rect x="40" y="53" width="174" height="216" rx="55" fill="#fcf6e5"/><rect x="57" y="68" width="140" height="184" rx="43" fill="url(#glass)"/><path d="M127 70v181M57 165h140" stroke="#fff9ed" stroke-width="11"/><path d="M41 50v221q49-27 32-203M214 50v221q-49-27-32-203" fill="#e99381"/><rect x="283" y="88" width="307" height="15" rx="6" fill="#b78762"/><rect x="299" y="36" width="21" height="50" rx="4" fill="#438e87"/><rect x="327" y="28" width="27" height="59" rx="4" fill="#eead6a"/><rect x="365" y="39" width="19" height="48" rx="3" fill="#b4bfd4"/><rect x="284" y="184" width="304" height="16" rx="5" fill="#b78762"/><rect x="464" y="139" width="25" height="44" rx="3" fill="#eeae8e"/><rect x="492" y="129" width="22" height="53" rx="3" fill="#649390"/><rect x="520" y="135" width="18" height="47" rx="3" fill="#c9ad69"/><ellipse cx="318" cy="440" rx="173" ry="45" fill="#e88e78"/><ellipse cx="318" cy="440" rx="140" ry="32" fill="none" stroke="#fbc4a1" stroke-width="5"/><rect x="380" y="275" width="192" height="98" rx="29" fill="#57938a"/><rect x="371" y="325" width="210" height="52" rx="19" fill="#6da499"/><rect x="396" y="288" width="63" height="57" rx="15" fill="#d5e1c6"/><rect x="476" y="288" width="65" height="55" rx="15" fill="#ecd297"/><rect x="390" y="371" width="12" height="38" rx="5" fill="#986b4d"/><rect x="551" y="370" width="12" height="38" rx="5" fill="#986b4d"/><path d="M141 347l-11 96M333 347l11 96" stroke="#98714f" stroke-width="13"/><rect x="113" y="318" width="249" height="35" rx="17" fill="#b9906c"/><path d="M125 320h224l-13 48q-47-18-89-1t-110 0z" fill="#fff7df"/><rect x="49" y="322" width="47" height="61" rx="12" fill="#d4b268"/><path d="M74 323v-76m0 39q-49-39-32-52 36 0 32 52m0-9q48-44 37-57-37 4-37 57" fill="#639984" stroke="#639984" stroke-width="5"/><circle cx="263" cy="145" r="22" fill="#fff9e7" stroke="#c6aa72" stroke-width="5"/><path d="M263 132v15l9 4" fill="none" stroke="#69837b" stroke-width="3"/></svg><div id="hotspots"></div></div></section><footer class="footer"><button class="btn" id="reset">הרפתקה חדשה</button></footer></main><dialog id="game"><div class="dialog-top"><h2 id="gameTitle"></h2><button class="close" id="close" aria-label="סגירה">×</button></div><div id="stage"></div><p class="feedback" id="feedback" aria-live="polite"></p></dialog><script>/* UI */</script><script>
/* CONTENT */
const U=PlayUI,$=s=>document.querySelector(s),KEY='morash-escape-v2';
let state=U.read(KEY,{done:[],level:1,nikud:false,opened:false});if(!Array.isArray(state.done))state={done:[],level:1,nikud:false,opened:false};
let cancel=()=>{},current=null,epoch=0;const names=['תופסים כוכבים','זיכרון מהיר','מנגינת צבעים','פאזל הזזה','עין חדה'];
const positions=[[83,66],[37,62],[74,27],[21,24],[55,16]],txt=o=>o[state.nikud?'n':'p'];
function save(){U.save(KEY,state)}
function render(){ $('#level').value=state.level;$('#nikud').ariaPressed=String(state.nikud);$('#nikud').textContent=state.nikud?'ניקוד אותיות: פעיל':'ניקוד אותיות';$('#score').textContent=state.done.length*100+(state.opened?250:0);$('#found').textContent=state.done.length+' / 5';$('#bag').innerHTML=OBJECTS.map(o=>`<span class="letter ${state.done.includes(o.id)?'earned':''}">${state.done.includes(o.id)?o.letter:'?'}</span>`).join('');$('#maplist').innerHTML=OBJECTS.map((o,i)=>`<button data-open="${i}">${o.ico} ${names[i]} ${state.done.includes(o.id)?'✓':''}</button>`).join('');$('#hotspots').innerHTML=OBJECTS.map((o,i)=>`<button class="hotspot ${state.done.includes(o.id)?'done':''}" style="right:${100-positions[i][0]}%;top:${positions[i][1]}%" data-open="${i}" aria-label="${txt(o.name)} — ${names[i]}">${o.ico}</button>`).join('');$('#chest').textContent=state.opened?'🎉 התיבה נפתחה!':state.done.length===5?'🔑 כל האותיות כאן! פותחים את התיבה':'🔒 התיבה מחכה לאותיות';}
function clean(){epoch++;cancel();cancel=()=>{};$('#feedback').textContent=''}
function open(i){clean();current=i;$('#gameTitle').textContent=names[i];U.dialog('game');const o=OBJECTS[i];$('#stage').innerHTML=`<span class="stage-chip">אתגר ${i+1} מתוך 5</span><p class="challenge-label" id="how"></p><div class="stage-progress"><span id="challengeCount" aria-live="polite">0</span><div class="progress" role="progressbar" aria-label="התקדמות באתגר" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div></div><div id="play"></div>`;[catchStars,memory,sequence,puzzle,search][i](()=>riddle(o));}
function progress(a,b){$('#fill').style.width=a/b*100+'%';$('#fill').parentElement.setAttribute('aria-valuenow',Math.round(a/b*100));const c=$('#challengeCount');if(c)c.textContent=a+' / '+b}
function finishAction(done){const token=epoch;$('#feedback').textContent='יש! האתגר הושלם ✦';U.celebrate();const t=setTimeout(()=>{if(token===epoch)done()},650);cancel=()=>clearTimeout(t)}
function catchStars(done){const goal=[8,12,18][state.level-1];let got=0;$('#how').textContent='תפסו את הכוכבים! נוגעים בכוכב כדי לאסוף אותו.';$('#play').innerHTML='<div class="arena"></div>';const field=$('.arena');function add(){if(got>=goal)return;const b=document.createElement('button');b.className='target';b.textContent='★';b.ariaLabel='איסוף כוכב';b.style.cssText=`left:${8+Math.random()*70}%;top:${5+Math.random()*66}%;animation-duration:${2.6-state.level*.5}s`;b.onclick=()=>{if(!b.isConnected)return;b.remove();got++;progress(got,goal);if(got===goal){field.replaceChildren();finishAction(done)}else add()};field.append(b)}for(let i=0;i<3;i++)add()}
function memory(done){const pairs=[3,4,6][state.level-1],icons=['⭐','💛','🎁','🌸','🔑','🎈'],deck=U.shuffle([...icons.slice(0,pairs),...icons.slice(0,pairs)]);let first=null,locked=false,got=0,timer;$('#how').textContent='הופכים שני קלפים ומוצאים את הזוגות. אפשר לנסות שוב בלי לאבד נקודות.';$('#play').innerHTML='<div class="cards">'+deck.map((s,i)=>`<button data-card="${i}" aria-label="קלף ${i+1}">✦</button>`).join('')+'</div>';$('.cards').onclick=e=>{const b=e.target.closest('[data-card]');if(!b||locked||b.classList.contains('up')||b.disabled)return;b.classList.add('up');b.textContent=deck[b.dataset.card];b.ariaLabel=deck[b.dataset.card];if(!first){first=b;return}locked=true;const a=first;first=null;timer=setTimeout(()=>{if(a.textContent===b.textContent){a.disabled=b.disabled=true;a.classList.add('matched');b.classList.add('matched');got++;progress(got,pairs);if(got===pairs)finishAction(done)}else{for(const c of [a,b]){c.classList.remove('up');c.textContent='✦';c.ariaLabel='קלף '+(+c.dataset.card+1)}}locked=false},650)};cancel=()=>clearTimeout(timer)}
function sequence(done){const goal=[3,4,6][state.level-1],seq=Array.from({length:goal},()=>Math.floor(Math.random()*4));let round=1,pos=0,showing=false,timers=[];$('#how').textContent='זוכרים את הצבעים שנדלקים וחוזרים על הסדר. בכל סיבוב נוסף צבע!';$('#play').innerHTML='<div class="sequence">'+['#f1b985','#a4d5c5','#b9b2dc','#eea399'].map((c,i)=>`<button style="background:${c}" data-tone="${i}" aria-label="צבע ${i+1}">${['☀','✿','◆','♥'][i]}</button>`).join('')+'</div><div class="toolbar"><button class="btn" id="againSeq">להראות שוב</button><button class="btn" id="practiceSeq">רצף לתרגול</button></div><div id="practicePattern" class="practice-pattern" aria-live="polite"></div>';const buttons=[...document.querySelectorAll('[data-tone]')];function later(fn,ms){timers.push(setTimeout(fn,ms))}function play(){$('#practicePattern').textContent='';timers.forEach(clearTimeout);buttons.forEach(b=>b.classList.remove('lit'));pos=0;showing=true;$('#feedback').textContent='מסתכלים...';seq.slice(0,round).forEach((v,i)=>{later(()=>buttons[v].classList.add('lit'),400+i*900);later(()=>buttons[v].classList.remove('lit'),1000+i*900)});later(()=>{showing=false;$('#feedback').textContent='עכשיו תורכם!'},400+round*900)}buttons.forEach((b,i)=>b.onclick=()=>{if(showing)return;if(i!==seq[pos]){$('#feedback').textContent='ננסה שוב את אותו הרצף';later(play,700);showing=true;return}b.classList.add('lit');later(()=>b.classList.remove('lit'),200);pos++;if(pos===round){progress(round,goal);if(round===goal){showing=true;timers.forEach(clearTimeout);finishAction(done)}else{round++;showing=true;later(play,700)}}});$('#againSeq').onclick=play;$('#practiceSeq').onclick=()=>{$('#practicePattern').textContent=seq.slice(0,round).map(v=>['☀','✿','◆','♥'][v]).join('  ←  ')};play();cancel=()=>timers.forEach(clearTimeout)}
function puzzle(done){const n=state.level===1?2:3,total=n*n;let board=Array.from({length:total},(_,i)=>i),won=false;const neighbours=()=>{const e=board.indexOf(total-1);return board.map((v,i)=>i).filter(i=>Math.abs(i%n-e%n)+Math.abs(Math.floor(i/n)-Math.floor(e/n))===1)};let previous=-1;for(let i=0;i<[7,17,39][state.level-1];i++){const e=board.indexOf(total-1),pool=neighbours().filter(x=>x!==previous),j=pool[Math.floor(Math.random()*pool.length)];[board[e],board[j]]=[board[j],board[e]];previous=e}if(board.every((v,i)=>v===i)){const e=board.indexOf(total-1),j=neighbours()[0];[board[e],board[j]]=[board[j],board[e]]}$('#how').textContent='מסדרים את המספרים לפי הסדר משמאל לימין. לוחצים על חלק ליד המשבצת הריקה.';function draw(){$('#play').innerHTML=`<div class="tiles" style="grid-template-columns:repeat(${n},1fr)">`+board.map((v,i)=>`<button data-tile="${i}" class="${v===total-1?'blank':v===i?'placed':''}" aria-label="${v===total-1?'משבצת ריקה':'חלק '+(v+1)}">${v+1}</button>`).join('')+'</div>';progress(board.filter((v,i)=>v===i).length,total);$('.tiles').onclick=e=>{const b=e.target.closest('[data-tile]');if(!b||won)return;const i=+b.dataset.tile,j=board.indexOf(total-1);if(!neighbours().includes(i))return;[board[i],board[j]]=[board[j],board[i]];draw();if(board.every((v,i)=>v===i)){won=true;finishAction(done)}}}draw()}
function search(done){const goal=[4,6,9][state.level-1];let got=0;const icons=['★','♥','✿','◆','●','☀'];$('#how').textContent='מוצאים את הסימן שמופיע למעלה. בכל סיבוב מחכה סימן אחר.';function draw(){const target=icons[Math.floor(Math.random()*icons.length)],items=U.shuffle([target,...Array.from({length:[5,8,11][state.level-1]},()=>U.shuffle(icons.filter(x=>x!==target))[0])]);$('#play').innerHTML=`<p style="font-size:42px;text-align:center;margin:0">${target}</p><div class="cards">`+items.map(s=>`<button class="up" data-symbol="${s}" style="color:${U.shuffle(['#1c7a74','#bb6445','#6c639a'])[0]}">${s}</button>`).join('')+'</div>';$('.cards').onclick=e=>{const b=e.target.closest('[data-symbol]');if(!b)return;if(b.dataset.symbol!==target){$('#feedback').textContent='כמעט! חפשו את אותו הסימן';return}got++;progress(got,goal);if(got===goal){$('.cards').onclick=null;finishAction(done)}else{draw();$('#feedback').textContent='עוד אחד נאסף!'}}}draw()}
function riddle(o){clean();$('#gameTitle').textContent='החידה של האות';const choices=U.shuffle([o,...U.shuffle(DECOYS).slice(0,state.level===1?1:3).map((d,i)=>({...d,id:100+i}))]);$('#stage').innerHTML=`<p class="riddle">${U.escape(txt(o.riddle))}</p><div class="choice-grid">${choices.map(c=>`<button class="btn" data-answer="${c.id}"><span class="emoji">${c.ico}</span><span>${U.escape(txt(c.name))}</span></button>`).join('')}</div><button class="btn" id="hint" style="margin-top:18px">רמז</button>`;$('#hint').onclick=()=>$('#feedback').textContent=txt(o.hint);$('.choice-grid').onclick=e=>{const b=e.target.closest('[data-answer]');if(!b)return;if(+b.dataset.answer!==o.id){$('#feedback').textContent='אפשר לנסות שוב';return}const replay=state.done.includes(o.id);if(!replay)state.done.push(o.id);save();render();U.celebrate();$('#stage').innerHTML=`<div class="reward pop"><span class="tag">האות שלכם!</span><div class="big">${o.letter}</div><h2>${replay?'פתרתם שוב! האות כבר בכיס שלכם':'עוד 100 נקודות בכיס ✦'}</h2><p>${txt(o.name)}</p><button class="btn primary" id="back">חוזרים לבית</button></div>`;$('#feedback').textContent='';$('#back').onclick=()=>$('#game').close()}}
$('#level').onchange=e=>{state.level=+e.target.value;save()};$('#nikud').onclick=()=>{state.nikud=!state.nikud;save();render()};document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)open(+b.dataset.open)});$('#close').onclick=()=>$('#game').close();$('#game').addEventListener('close',clean);$('#game').addEventListener('cancel',clean);
$('#reset').onclick=()=>{if(confirm('להתחיל הרפתקה חדשה ולאפס את האותיות והנקודות במשחק הזה?')){state.done=[];state.opened=false;save();render()}};
$('#chest').onclick=()=>{if(state.done.length<5){U.toast('עוד '+(5-state.done.length)+' אותיות לפתיחת התיבה');return}clean();U.dialog('game');$('#gameTitle').textContent='התיבה הסודית';let entered=[];const letters=U.shuffle(OBJECTS.map(o=>o.letter));$('#stage').innerHTML='<p class="challenge-label">לוחצים על האותיות לפי הסדר כדי להרכיב את המילה הסודית.</p><div class="letterbag" id="code"></div><div class="finalpool">'+letters.map((c,i)=>`<button data-letter="${i}">${c}</button>`).join('')+'</div><div class="toolbar" style="justify-content:center"><button class="btn" id="undoCode">צעד אחורה</button><button class="btn primary" id="unlock">פותחים!</button></div>';const draw=()=>$('#code').innerHTML=Array.from({length:5},(_,i)=>`<span class="letter ${entered[i]!=null?'earned':''}">${entered[i]!=null?letters[entered[i]]:'·'}</span>`).join('');draw();$('.finalpool').onclick=e=>{const b=e.target.closest('[data-letter]');if(!b||b.disabled)return;entered.push(+b.dataset.letter);b.disabled=true;draw()};$('#undoCode').onclick=()=>{if(!entered.length)return;document.querySelector(`[data-letter="${entered.pop()}"]`).disabled=false;draw()};$('#unlock').onclick=()=>{if(entered.map(i=>letters[i]).join('')!=='גאולה'){$('#feedback').textContent='עוד ניסיון! אפשר לחזור צעד אחורה ולסדר מחדש.';return}state.opened=true;save();render();U.celebrate();$('#stage').innerHTML='<div class="reward"><div class="big">🎁</div><h2>גאולה</h2><p class="riddle">כשיש בבית אהבה, חסד ומצוות, אנחנו מזרזים את הגאולה!</p><span class="tag">בונוס תיבה · 250 נקודות</span></div>';$('#feedback').textContent=''}};render();
</script></body></html>
