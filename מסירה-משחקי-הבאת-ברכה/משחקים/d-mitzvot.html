<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>מסע המצוות · מורה שמיים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{--pink:#e9408f;--gold:#f2b705;--sky:#38b6ff;--mint:#3fd0a8;--coral:#ff7a6b;--lav:#a78bfa;
  --ink:#22304a;--paper:#fff8ef;--line:#ffe2c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Varela Round",system-ui,sans-serif;color:var(--ink);overflow-x:hidden;
  background:radial-gradient(circle at 10% 0%,#ffe9f4 0 26%,transparent 26.5%),
             radial-gradient(circle at 92% 3%,#fff2cd 0 20%,transparent 20.5%),var(--paper)}
h1,h2,h3,.disp{font-family:"Secular One",sans-serif;font-weight:400;margin:0}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#fff,#fffdf8);
  border-bottom:3px solid var(--line);box-shadow:0 3px 14px rgba(34,48,74,.07)}
.bar{max-width:820px;margin:0 auto;padding:7px 10px;display:flex;align-items:center;gap:6px}
#logo{display:flex;align-items:center;gap:6px}
#logo img{height:40px}
.lf-name{font-family:"Secular One";font-size:14px;color:var(--sky);line-height:1}
.lf-sub{font-size:8.5px;color:#a6aebd;letter-spacing:.12em}
.grow{flex:1}
.iconbtn{width:33px;height:33px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:13px;display:grid;place-items:center;font-family:"Secular One"}
.iconbtn.on{background:var(--sky);color:#fff;border-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 0 rgba(34,48,74,.07);border:3px solid #fff;margin-bottom:12px}
.card h2{font-size:19px;margin-bottom:4px}
.hint{font-size:12.5px;color:#9aa3b3;margin-bottom:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:64px;border:3px solid #eef2f8;background:#fff;border-radius:16px;padding:10px 6px;font-size:13.5px;font-weight:700;text-align:center;line-height:1.5}
.opt.sel{border-color:var(--pink);background:#fff2f8;color:var(--pink)}
.prow{display:flex;gap:7px;align-items:center;margin-bottom:9px;background:#fbfcff;border-radius:16px;padding:8px;border:2px solid #eef2f8}
.prow input{flex:1;min-width:0;border:2px solid #e6ecf5;border-radius:12px;padding:9px;font-size:15px;font-family:inherit;outline:none}
.prow input:focus{border-color:var(--sky)}
.gsel{display:flex;gap:4px}
.gbtn{border:2px solid #e6ecf5;background:#fff;border-radius:12px;padding:8px;font-size:13px;font-weight:700}
.gbtn.sel{border-color:var(--pink);background:var(--pink);color:#fff}
.avdot{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.12);padding:3px}
.bigbtn{width:100%;border:none;border-radius:18px;padding:15px;font-family:"Secular One";font-size:18px;color:#fff;
  background:linear-gradient(180deg,var(--pink),#c72b74);box-shadow:0 6px 0 #a52260}
.bigbtn:active{transform:translateY(5px);box-shadow:none}
.bigbtn:disabled{background:#dfe5ee;box-shadow:0 6px 0 #cbd3e0;color:#9aa3b3}
.bigbtn.blue{background:linear-gradient(180deg,var(--sky),#1f92d4);box-shadow:0 6px 0 #1678b0}
.bigbtn.green{background:linear-gradient(180deg,var(--mint),#22a583);box-shadow:0 6px 0 #178c6f}
.boardwrap{max-width:520px;margin:8px auto;padding:0 8px}
.board{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);
  gap:4px;aspect-ratio:1/1;background:linear-gradient(135deg,#ffd9ec,#d9f0ff);padding:6px;border-radius:24px;
  box-shadow:0 10px 28px rgba(34,48,74,.16);border:3px solid #fff}
.cell{position:relative;background:#fff;border-radius:11px;display:grid;place-items:center;font-size:16px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.cell.t-mitzva{background:#fff3d6}.cell.t-sit{background:#e8f7ff}.cell.t-quiz{background:#efe9ff}
.cell.t-challenge{background:#ffe9e5}.cell.t-chesed{background:#ffe6f1}.cell.t-shabbat{background:#e6fbf1}
.cell.t-surprise{background:#fdf0c9}.cell.t-start{background:linear-gradient(135deg,var(--gold),#ffd977)}
.cell.hot{animation:hot .5s ease}
@keyframes hot{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.tok{position:absolute;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;padding:2px;
  border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);z-index:5}
.center{grid-area:2/2/7/7;background:#fff;border-radius:18px;padding:8px;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 3px #f4f7fc;overflow:hidden}
.turnwho{text-align:center;font-family:"Secular One";font-size:15px}
.turnwho span{color:var(--pink)}
.minicity{flex:1;position:relative;margin:6px -8px 0;overflow:hidden;
  background:linear-gradient(180deg,#8fd8f7 0%,#d5f0ff 60%,#a8e39a 60%,#8ccf7d 100%);transition:background 1s}
.minicity.night{background:linear-gradient(180deg,#17264c 0%,#37508f 60%,#2f5a3d 60%,#274c33 100%)}
.mtrack{position:absolute;bottom:6px;right:0;display:flex;align-items:flex-end;gap:2px;padding:0 8px;
  height:92%;overflow-x:auto;scrollbar-width:none;width:100%}
.mtrack::-webkit-scrollbar{display:none}
.mtrack svg{display:block}
.mempty{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;color:#3d6a86;text-align:center;padding:0 14px}
.win{fill:#d3ecf9}.minicity.night .win,.fullcity.night .win{fill:#ffeaa0}
.lampglow{opacity:0}.minicity.night .lampglow,.fullcity.night .lampglow{opacity:.85}
.pop{animation:pop 1s cubic-bezier(.2,1.5,.4,1) both;transform-origin:bottom center}
@keyframes pop{0%{transform:scaleY(.02);opacity:0}55%{transform:scaleY(1.1);opacity:1}100%{transform:none}}
.scorerow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.sc{font-size:10.5px;border-radius:999px;padding:2px 7px;color:#fff;font-weight:700}
.sc.cur{outline:2px solid var(--ink);outline-offset:1px}
.actionrow{max-width:520px;margin:10px auto 26px;padding:0 8px}
.ov{position:fixed;inset:0;background:rgba(18,26,44,.62);display:none;place-items:center;z-index:60;padding:12px}
.ov.on{display:grid}
.sheet{background:#fff;border-radius:26px;padding:16px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.35);animation:up .4s cubic-bezier(.2,1.4,.4,1) both;max-height:94vh;overflow:auto}
@keyframes up{from{transform:translateY(24px) scale(.93);opacity:0}to{transform:none;opacity:1}}
.kicker{font-size:11.5px;letter-spacing:.08em;color:#a6aebd;font-weight:700}
.sheet h3{font-size:21px;margin:5px 0 4px}
.cardtxt{font-size:16px;line-height:1.65;margin:8px 0 6px;font-weight:700}
.gain{display:inline-block;background:linear-gradient(180deg,var(--gold),#e0a600);color:#4a3500;
  font-family:"Secular One";border-radius:999px;padding:5px 15px;font-size:15px;margin:4px 0}
.ansbtn{width:100%;border:3px solid #eef2f8;background:#fff;border-radius:15px;padding:12px;font-size:15px;font-weight:700;margin-bottom:7px;line-height:1.45}
.ansbtn.ok{border-color:#3fd0a8;background:#e8fff7}
.ansbtn.no{border-color:#ffb3ab;background:#fff0ee;opacity:.75}
.timer{height:12px;border-radius:999px;background:#eef2f8;overflow:hidden;margin:9px 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));width:100%}
.chooser{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chooser button{border:3px solid #eef2f8;background:#fff;border-radius:14px;padding:8px 11px;font-weight:700;font-size:13.5px}
.homecard{background:#fff8e6;border:2px solid #ffe3a3;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.6;color:#6b5410;margin-top:9px;text-align:right}
.homecard b{color:#a37b00}
/* ---- זירת מיני־משחק ---- */
.arena{position:relative;height:280px;border-radius:18px;overflow:hidden;margin:8px 0;user-select:none;touch-action:none;
  background:linear-gradient(180deg,#eef7ff,#fdfaf2)}
.arena.room{background:linear-gradient(180deg,#fdf3e3 70%,#e8d9be 70%)}
.arena.outdoor{background:linear-gradient(180deg,#bfe6fb 62%,#a8dd98 62%)}
.arena.nightroom{background:linear-gradient(180deg,#243154 70%,#3a3350 70%)}
.instr{font-size:13.5px;font-weight:700;color:#4c6b8a;margin:2px 0 4px}
.dragit{position:absolute;cursor:grab;touch-action:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18));z-index:6}
.dragit.held{cursor:grabbing;z-index:9;transform:scale(1.15)}
.dragit .em{font-size:34px;line-height:1}
.dropzone{position:absolute;border:3px dashed #b9cfe4;border-radius:14px;display:grid;place-items:center;
  background:rgba(255,255,255,.55);font-size:12px;font-weight:700;color:#6b87a3;padding:4px}
.dropzone.glow{border-color:var(--mint);background:#e8fff7}
.chipwrap{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0}
.chip{border:3px solid #dbe6f2;background:#fff;border-radius:13px;padding:9px 13px;font-size:16px;font-weight:700}
.chip.used{opacity:.25;pointer-events:none}
.chip.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(5px)}50%{transform:translateX(-5px)}75%{transform:translateX(3px)}}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:44px;background:#f4f8fd;border-radius:13px;padding:8px}
.slot2{min-width:52px;height:36px;border-bottom:3px solid #c6d6e8;display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--ink)}
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}
.memcard{aspect-ratio:1;border-radius:14px;background:linear-gradient(135deg,var(--sky),#7fd0ff);display:grid;place-items:center;
  cursor:pointer;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.memcard .face{display:none}
.memcard.open{background:#fff}
.memcard.open .face{display:block}
.memcard.lock{background:#e8fff7;border-color:#3fd0a8;pointer-events:none}
.matchcols{display:flex;gap:10px;margin:10px 0}
.matchcols>div{flex:1;display:flex;flex-direction:column;gap:7px}
.mbtn{border:3px solid #dbe6f2;background:#fff;border-radius:13px;padding:9px;font-size:14px;font-weight:700;min-height:52px}
.mbtn.sel{border-color:var(--sky);background:#eaf7ff}
.mbtn.lock{border-color:#3fd0a8;background:#e8fff7;pointer-events:none}
.readbox{background:#fffdf4;border:2px solid #f1e6c3;border-radius:15px;padding:13px;text-align:center;margin:9px 0}
.readline{font-size:17px;line-height:2;color:#b9a97a;transition:color .3s}
.readline.lit{color:#22304a}
.readline .w{transition:all .25s;border-radius:5px;padding:0 2px}
.readline .w.hot{background:#ffe9a8;color:#7a5b00}
.meter{height:20px;border-radius:999px;background:#eef2f8;overflow:hidden;border:2px solid #fff;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3fd0a8,#ffd166,#ff7a6b);transition:width .25s}
.soothe{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.soothe button{border:3px solid #eef2f8;background:#fff;border-radius:14px;padding:10px;font-size:14px;font-weight:700}
.soothe button:disabled{opacity:.4}
/* ---- לוח ציור ---- */
#drawWrap{margin:8px 0}
#drawCv{width:100%;height:250px;border-radius:16px;background:#fff;border:3px solid #e8eef6;touch-action:none;display:block}
.palette{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.pal{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:pointer}
.pal.sel{outline:3px solid var(--ink);outline-offset:1px}
.brushes{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:8px}
.brush{border:2px solid #dbe6f2;background:#fff;border-radius:10px;width:42px;height:34px;display:grid;place-items:center}
.brush.sel{border-color:var(--pink);background:#fff2f8}
.brush i{background:#22304a;border-radius:50%;display:block}
.count3{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.75);
  font-family:"Secular One";font-size:64px;color:var(--pink);z-index:9}
.spark{position:absolute;font-size:15px;animation:sp .6s ease-out forwards;pointer-events:none;color:#f2b705;font-weight:700;z-index:9}
@keyframes sp{to{transform:translateY(-34px) scale(1.5);opacity:0}}
.falling{position:absolute;will-change:transform;cursor:pointer}
.basket{position:absolute;bottom:2px;will-change:transform}
.catchTop{display:flex;justify-content:space-between;font-family:"Secular One";font-size:15px;padding:0 4px}
.arrows{display:flex;gap:10px;margin-top:6px}
.arrow{flex:1;border:none;border-radius:16px;padding:15px;font-size:23px;background:#eef4ff;color:#2b5f8f;box-shadow:0 4px 0 #cfdcf0}
.arrow:active{transform:translateY(3px);box-shadow:none;background:#dbe9ff}
.dragtip{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:12.5px;color:#2b5f8f;z-index:8;animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
#cityFull .sheet,#albumOv .sheet{max-width:640px;padding:14px}
.fullcity{height:220px;border-radius:18px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#7ed2f7,#cbeeff 62%,#88cf78 62%,#6fbb60 100%)}
.fullcity.night{background:linear-gradient(180deg,#132247,#3a5290 62%,#2f5a3d 62%,#26492f 100%)}
.legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:9px;max-height:110px;overflow:auto}
.lg{font-size:11px;background:#f4f7fc;border-radius:999px;padding:3px 8px;color:#5b667a}
.album{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:56vh;overflow:auto;margin-top:8px}
.album figure{margin:0;background:#f7f9fc;border-radius:14px;overflow:hidden}
.album img{width:100%;height:110px;object-fit:contain;background:#fff;display:block}
.album figcaption{font-size:10.5px;padding:5px;color:#5b667a}
#printBox{display:none}
@media print{
  body>*{display:none!important}
  body.printing #printBox{display:block!important}
  #printBox img{width:100%;max-height:85vh;object-fit:contain}
  #printBox .pt{font-family:"Secular One";text-align:center;font-size:22px;color:#22304a}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<style>@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#203e40;--teal:#188f91;--teal-dark:#0e666b;--coral:#f17f70;--cream:#fff9ed;--gold:#edbd51;--line:#203e401a;--shadow:0 18px 60px #193f3910}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:Heebo,Arial,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a34b22;outline-offset:4px}button,a{touch-action:manipulation}h1,h2,h3,p{margin-top:0}p{line-height:1.75}.shell{max-width:1240px;margin:auto;padding:26px}.brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);background:#fffcf5}.brandmark{font-weight:900;font-size:21px;color:var(--teal-dark)}.brandnote{font-size:13px;color:#617373}.eyebrow{letter-spacing:.06em;font-size:13px;font-weight:800;color:var(--teal-dark)}.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;padding:30px 0}.hero h1{font-size:clamp(38px,5vw,70px);line-height:1.1;letter-spacing:-.045em;margin:14px 0 20px}.hero p{max-width:540px;color:#546b6a}.chip,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:16px;padding:12px 19px;background:white;color:var(--ink);font-weight:700;min-height:46px;text-decoration:none}.btn.primary{background:var(--teal-dark);color:white;border-color:transparent;box-shadow:0 5px 0 #094c50}.btn.coral{background:var(--coral);border-color:transparent;color:#482f29;box-shadow:0 5px 0 #d76458}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px)}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.panel{background:#fffdf8;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:28px;padding:24px}.muted{color:#647775;font-size:14px}.stat{background:white;border:1px solid var(--line);border-radius:20px;padding:14px 22px;text-align:center}.stat b{display:block;font-size:28px}.stat span{font-size:13px;color:#637674}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tag{background:#d9efea;color:#276b65;padding:6px 11px;border-radius:50px;font-size:12px;font-weight:800}.field{display:grid;gap:7px;margin:12px 0}input,select,textarea{padding:11px 14px;border:1px solid #ccd6ce;background:white;border-radius:12px;max-width:100%;color:var(--ink)}.is-hidden,[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:30px;max-width:min(780px,calc(100% - 24px));width:780px;max-height:92dvh;padding:28px;color:var(--ink);background:var(--cream);box-shadow:0 24px 120px #10272f50}dialog::backdrop{background:#173d43a8;backdrop-filter:blur(6px)}.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.dialog-top h2{margin:0;font-size:24px}.close{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:white;font-size:23px}.progress{height:10px;border-radius:20px;overflow:hidden;background:#dce9de;margin:16px 0}.progress>i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}.feedback{min-height:28px;text-align:center;font-weight:700;margin:12px 0;color:var(--teal-dark)}.pop{animation:pop .4s both}@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}.play-confetti{position:fixed;z-index:99999;pointer-events:none;width:9px;height:15px;top:-30px;animation:fall 1.7s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(700deg);opacity:.3}}.toast-msg{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:18px;padding:12px 22px;z-index:99999;max-width:90%;text-align:center}.footer{padding:32px 0;text-align:center;font-size:13px;color:#71817c}.controlbar{margin:16px auto;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px;background:#fffaf0;border:1px solid #dbcaa8;border-radius:18px;m /* =============== מיני־משחק תפיסה (התקדמות) =============== */
let catchRAF=null,holdInt=null;
function playCatch(cb){
  const p=cur(),area=$("#catchArea");const dDuration=[12000,10000,8000][dLevel-1];let lastHidden=performance.now();
  $("#catchName").textContent=p.name;
  $("#catchHint").textContent=TX(UI.catchH);
  $("#catchRule").textContent=TX(UI.rule);
  area.className="arena"+(G.night?" nightroom":"");
  area.innerHTML="";$("#catchCount").textContent="0";$("#catchTime").textContent="8";
  $("#catchBar").style.width="100%";
  $("#catchOv").classList.add("on");
  const basket=document.createElement("div");
  basket.className="basket";basket.innerHTML=ic("basket",46);
  area.appendChild(basket);
  const tip=document.createElement("div");tip.className="dragtip";tip.textContent=TX(UI.dragtip);
  area.appendChild(tip);
  const W=()=>area.clientWidth,H=()=>area.clientHeight;
  let hx=W()/2,caught=0,items=[],last=0,t0=0,spawn=0,done=false,started=false;
  const setB=()=>basket.style.transform="translateX("+(hx-23)+"px)";
  setB();
  const move=e=>{
    const r=area.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    hx=Math.max(23,Math.min(W()-23,cx));setB();tip.style.display="none";
  };
  area.addEventListener("pointermove",move);
  area.addEventListener("pointerdown",move);
  const keys=e=>{
    if(e.key==="ArrowLeft")hx=Math.max(23,hx-32);
    if(e.key==="ArrowRight")hx=Math.min(W()-23,hx+32);
    setB();
  };
  addEventListener("keydown",keys);
  const nudge=dir=>{hx=Math.max(23,Math.min(W()-23,hx+dir*30));setB();tip.style.display="none";};
  const hs=dir=>e=>{e.preventDefault();nudge(dir);clearInterval(holdInt);holdInt=setInterval(()=>nudge(dir),70);};
  const he=()=>clearInterval(holdInt);
  const aL=$("#arrLeft"),aR=$("#arrRight");
  aL.onpointerdown=hs(-1);aR.onpointerdown=hs(1);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>{aL.addEventListener(ev,he);aR.addEventListener(ev,he);});
  const c3=document.createElement("div");c3.className="count3";c3.textContent="3";
  area.appendChild(c3);
  let n=3;
  const cd=setInterval(()=>{
    n--;
    if(n>0)c3.textContent=n;
    else{clearInterval(cd);c3.remove();started=true;last=performance.now();t0=last;catchRAF=requestAnimationFrame(frame);}
  },700);
  function pop(x,y){
    const s=document.createElement("div");s.className="spark";
    s.style.left=x+"px";s.style.top=y+"px";s.textContent="+1";
    area.appendChild(s);setTimeout(()=>s.remove(),600);
  }
  function grab(it){
    if(it.dead)return;
    it.dead=true;caught++;$("#catchCount").textContent=caught;
    pop(it.x-10,Math.max(10,it.y));it.el.remove();
  }
  function finish(){
    if(done)return;done=true;
    clearInterval(cd);clearInterval(holdInt);cancelAnimationFrame(catchRAF);
    area.removeEventListener("pointermove",move);
    area.removeEventListener("pointerdown",move);
    removeEventListener("keydown",keys);
    aL.onpointerdown=null;aR.onpointerdown=null;
    $("#catchOv").classList.remove("on");
    cb(Math.max(1,Math.min(6,Math.round(caught/2))),caught);
  }
  function frame(now){
    if(!started)return;
    const dt=Math.min(50,now-last);last=now;
    if(document.hidden){t0+=Math.max(0,now-lastHidden);lastHidden=now;catchRAF=requestAnimationFrame(frame);return}if(now-lastHidden>250)t0+=now-lastHidden;lastHidden=now;const left=Math.max(0,dDuration-(now-t0));
    $("#catchTime").textContent=Math.ceil(left/1000);
    $("#catchBar").style.width=(left/dDuration*100)+"%";
    spawn-=dt;
    if(spawn<=0&&left>700){
      spawn=300+Math.random()*200;
      const d=document.createElement("div");
      d.className="falling";d.innerHTML=ic(rnd(CATCH_ITEMS),34);
      const x=16+Math.random()*Math.max(20,W()-52);
      d.style.left=x+"px";d.style.top="-36px";
      area.appendChild(d);
      const it={el:d,x:x+17,y:-36,v:.1+Math.random()*.1};
      d.addEventListener("pointerdown",e=>{e.stopPropagation();grab(it);});
      items.push(it);
    }
    items.forEach(it=>{
      it.y+=it.v*dt;it.el.style.transform="translateY("+(it.y+36)+"px)";
      if(!it.dead&&it.y>H()-78&&it.y<H()-16&&Math.abs(it.x-hx)<34)grab(it);
      if(it.y>H()+20){it.dead=true;it.el.remove();}
    });
    items=items.filter(i=>!i.dead);
    if(left<=0&&items.length===0){finish();return;}
    catchRAF=requestAnimationFrame(frame);
  }
}

function itemEl(v,size){
  size=size||34;
  const d=document.createElement("div");
  d.className="dragit";
  d.innerHTML=(v==="coin"||ICONS[v])?ic(v,size):'<span class="em">'+v+'</span>';
  return d;
}
function makeDraggable(el,arena,onDrop){
  let sx,sy,ox,oy,held=false;
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();held=true;el.classList.add("held");
    el.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;
    ox=parseFloat(el.style.left)||0;oy=parseFloat(el.style.top)||0;
  });
  el.addEventListener("pointermove",e=>{
    if(!held)return;
    el.style.left=(ox+e.clientX-sx)+"px";
    el.style.top=(oy+e.clientY-sy)+"px";
  });
  el.addEventListener("pointerup",e=>{
    if(!held)return;held=false;el.classList.remove("held");
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    if(!onDrop(el,cx,cy)){el.style.left=ox+"px";el.style.top=oy+"px";}
  });
}
function sparkAt(arena,x,y,txt){
  const s=document.createElement("div");s.className="spark";
  s.style.left=x+"px";s.style.top=y+"px";s.textContent=txt||"✨";

}

  function fit(){
    const r=cv.getBoundingClientRect();
    const img=cv.width?ctx2.getImageData(0,0,cv.width,cv.height):null;
    cv.width=r.width;cv.height=r.height;

function hop(steps){
  const p=cur();let n=0;

    placeTokens();
    const c=cellEls[p.pos];c.classList.remove("hot");void c.offsetWidth;c.classList.add("hot");

function land(type){
  const p=cur();
  if(p.ai)return aiResolve(type,p);
  if(type==="mitzva")cardMitzva(p);
  else if(type==="sit")cardSit(p);
  else if(type==="quiz")cardQuiz(p);
  else if(type==="challenge")cardChal(p);
  else if(type==="chesed")cardChesed(p);
  else if(type==="shabbat")cardShabbat(p);
  else if(type==="surprise")cardSurprise(p);
  else nextTurn();
}

function aiResolve(type,p){
  const c=cityOf(p);
  let msg,pts=0,mm=null;
  if(type==="mitzva"){
    const pool=MITZVOT.filter(m=>!c.done[m.id]);
    mm=pool.length?rnd(pool):rnd(MITZVOT);
    c.done[mm.id]=(c.done[mm.id]||0)+1;pts=mm.p;
    msg=K("השלים את המשימה ובנה ","הִשְׁלִים אֶת הַמְּשִׂימָה וּבָנָה ")+K(mm.b,mm.bn);
  }else if(type==="sit"){pts=2;msg=K("בחר בדרך הטובה","בָּחַר בַּדֶּרֶךְ הַטּוֹבָה");}
  else if(type==="quiz"){const ok=Math.random()<.7;pts=ok?2:0;msg=ok?K("ענה נכון!","עָנָה נָכוֹן!"):K("טעה בשאלה","טָעָה בַּשְּׁאֵלָה");}
  else if(type==="challenge"){pts=2;msg=K("עמד באתגר","עָמַד בָּאֶתְגָּר");}
  else if(type==="chesed"){const o=rnd(G.players.filter(x=>x!==p));if(o)o.pts+=2;pts=2;msg=K("עשה חסד ונתן נקודות","עָשָׂה חֶסֶד וְנָתַן נְקֻדּוֹת");}
  else if(type==="shabbat"){G.players.forEach(x=>x.pts+=1);msg=K("הדליק נרות — שבת שלום לכולם","הִדְלִיק נֵרוֹת — שַׁבָּת שָׁלוֹם לְכֻלָּם");}
  else if(type==="surprise"){pts=3;msg=K("קיבל הפתעה","קִבֵּל הַפְתָּעָה");}
  else msg=K("עבר את ההתחלה","עָבַר אֶת הַהַתְחָלָה");
  p.pts+=pts;
  renderGame();if(mm)renderMini(mm.id);
  showSheet('<div class="kicker">'+p.name+'</div>'+
    (mm?'<div style="height:88px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden"><div style="transform:scale(.48);transform-origin:bottom center">'+drawB(mm)+'</div></div>':'<div style="margin:8px 0">'+ic("crane",48)+'</div>')+
    '<div class="cardtxt">'+msg+'</div>'+(pts?'<div class="gain">+'+pts+'</div>':''));
  setTimeout(()=>{closeSheet();nextTurn();},1800);
}

}

const cv=$("#fx"),ctx=cv.getContext("2d");
let parts=[],running=false;
function fit(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener("resize",fit);fit();
function confetti(){
  const cols=["#e9408f","#f2b705","#38b6ff","#3fd0a8","#ff7a6b","#a78bfa"];
  for(let i=0;i<80;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*150,y:innerHeight*.35,
    vx:(Math.random()-.5)*9,vy:-Math.random()*12-4,s:5+Math.random()*6,c:cols[i%cols.length],
    r:Math.random()*6,vr:(Math.random()-.5)*.4,l:0});
  loop();
}
function loop(){
  if(running)return;running=true;
  (function f(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(p=>p.l<120);
    parts.forEach(p=>{
      p.l++;p.vy+=.42;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0,1-p.l/120);
      ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();
    });
    if(parts.length)requestAnimationFrame(f);
    else{ctx.clearRect(0,0,cv.width,cv.height);running=false;}
  })();
}

  async function showList(id=null){setPicking(false);selectedNote=typeof id==='string'?id:null;$('.entries').textContent='טוענת את ההערות המשותפות…';if(!list.open)list.showModal();try{await sync();renderList()}catch(error){renderList();const warning=document.createElement('p');warning.textContent=errorMessage(error)+' מוצג העותק האחרון מהמכשיר.';$('.entries').prepend(warning);const retry=document.createElement('button');retry.textContent='ניסיון נוסף';retry.onclick=()=>showList(selectedNote);$('.entries').append(retry)}}
  $('#gameFilter').onchange=renderList;$('#statusFilter').onchange=renderList;
  $('#all').onclick=showList;$('#close').onclick=()=>list.close();
  const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function report(exportNotes=notes){
    const p=profile();let general='';for(const record of backup.all().filter(r=>!r.completed||(r.type==='note'&&!exportNotes.some(n=>n.id===r.id))||(r.type==='reply'&&!exportNotes.some(n=>(n.replies||[]).some(x=>x.id===r.id))))){general+='<article><h2>'+(record.completed?'עותק מקומי של הערה שנשלחה — ':'טיוטה שלא פורסמה — ')+escape(record.data.title||'תגובה')+'</h2><p>'+escape(record.data.reviewer||'')+'</p><p>'+escape(record.data.comment||'')+'</p><p>'+escape(record.data.target||'')+'</p></article>'}for(const [id,value] of Object.entries(p)){if(value&&typeof value==='object'&&value.note){const title=document.querySelector('#note-'+id)?.closest('article')?.querySelector('h2')?.textContent||'חלק '+id;general+='<article><h2>'+escape(title)+'</h2><p>'+escape(value.note)+'</p></article>'}}
    return '<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>דוח תיקונים — הבאת ברכה</title><style>body{font:17px/1.7 Arial,sans-serif;background:#f7f6ef;color:#173f40;max-width:900px;margin:30px auto;padding:20px}article{border:1px solid #c2d1c6;background:white;border-radius:16px;padding:20px;margin:20px 0;break-inside:avoid}p{white-space:pre-wrap;overflow-wrap:anywhere}figure{position:relative;width:fit-content;max-width:100%;margin:12px 0}img{display:block;max-width:100%;height:auto}.dot{position:absolute;transform:translate(-50%,-50%);background:#bd3b30;color:white;border:2px solid white;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px}small{color:#576e66}a{overflow-wrap:anywhere}</style><h1>תיקונים למשחקי הבאת ברכה</h1><p>בודקת: '+escape(p.reviewerName||notes[0]?.reviewer||'לא צוין')+'\n'+escape(new Date().toLocaleString('he-IL'))+'\nמכשיר: '+escape(p.reviewDevice||'מופיע בכל סימון')+'</p><p>'+escape(p.generalNotes||'')+'</p>'+general+exportNotes.map((n,index)=>'<article><h2>'+ (index+1)+'. '+escape(n.title)+'</h2><p><b>'+escape(n.comment)+'</b></p><p>מצב: '+escape(({open:'פתוח',progress:'בטיפול',resolved:'טופל'})[n.status]||'פתוח')+'</p><p>הפריט שסומן: '+escape(n.target)+'\nהמסך: '+escape(n.frame)+'\nבודקת: '+escape(n.reviewer)+'\nתצוגה: '+escape(n.viewport)+' · '+escape(n.device)+'\nמיקום בפריט: '+Math.round(n.x*100)+'% משמאל, '+Math.round(n.y*100)+'% מלמעלה</p>'+(n.image&&(/^data:image\/jpeg;base64,[a-zA-Z0-9+/=]+$/.test(n.image)||n.image.startsWith(API+'/api/images/'))?'<figure><img alt="הפריט שסומן בזמן הבדיקה" src="'+escape(n.image)+'"><span class="dot" style="left:'+Number(n.x)*100+'%;top:'+Number(n.y)*100+'%">'+(index+1)+'</span></figure>':'')+(n.replies||[]).map(r=>'<p><b>'+escape(r.reviewer)+':</b> '+escape(r.comment)+'</p>').join('')+'<small>מזהה הפריט: '+escape(n.selector)+'</small><p><a href="'+escape(/^https?:/.test(n.url)?n.url:'#')+'">פתיחת המשחק</a> — ייתכן שצריך להתקדם שוב למסך המתואר.</p></article>').join('')+'</html>';
  }
  async function reportFile(){
    if(draft)keepDraft();try{await sync()}catch{}
    const exportNotes=structuredClone(notes);await Promise.all(exportNotes.map(async note=>{if(!note.image?.startsWith(API+'/api/images/'))return;try{const response=await fetch(note.image,{signal:AbortSignal.timeout(8000)});if(!response.ok)return;const blob=await response.blob();note.image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}catch{}}));
    const name=(profile().reviewerName||draft?.reviewer||'בדיקה').replace(/[^\p{L}\p{N} _-]/gu,'').slice(0,60);return new File(['\ufeff'+report(exportNotes)],'גיבוי-הערות-'+name+'.html',{type:'text/html;charset=utf-8'});
  }
  async function download(){const buttons=[$('#download'),$('#draftExport'),document.getElementById('downloadPointNotes')].filter(Boolean);buttons.forEach(b=>b.disabled=true);try{const file=await reportFile(),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('מסמך הגיבוי הוכן להורדה, כולל ההערות, התגובות והטיוטות. אפשר לפתוח, להדפיס ל־PDF או לשלוח אותו.')}catch{notify('הורדת הגיבוי נכשלה. נסי שוב לפני סגירת הדף.')}finally{buttons.forEach(b=>b.disabled=false)}}
  $('#download').onclick=download;$('#draftExport').onclick=download;
  if(navigator.canShare){$('#share').hidden=false;$('#share').onclick=async()=>{const file=await reportFile();if(!navigator.canShare({files:[file]})){download();return}try{await navigator.share({files:[file],title:'גיבוי הערות למשחקים'})}catch(e){if(e.name!=='AbortError')notify('השיתוף לא הושלם. הורידי את המסמך ושלחי אותו כקובץ.')}}}
  let pending=false;const schedule=()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;renderPins()})};
  window.addEventListener('scroll',schedule,true);window.addEventListener('resize',schedule);
  new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
  window.addEventListener('focus',()=>sync().catch(()=>{}));
  setInterval(()=>{if(!document.hidden&&!editor.open&&!list.open)sync().catch(()=>{})},30000);
  document.addEventListener('bracha-general-note',event=>{draft={id:event.detail.id||crypto.randomUUID(),page:location.pathname,url:location.href,title:event.detail.title,frame:'דף הבדיקה המרכזי',selector:event.detail.selector,target:'הערה כללית',x:.5,y:.5,viewport:innerWidth+' × '+innerHeight,device:matchMedia('(pointer:coarse)').matches?'מגע':'מחשב',time:new Date().toISOString(),comment:event.detail.comment||''};openEditor()});
  if(portal){$('.bar').hidden=true;document.getElementById('downloadPointNotes')?.addEventListener('click',download);document.getElementById('viewPointNotes')?.addEventListener('click',showList)}
  refresh();sync().catch(error=>notify(errorMessage(error)));
  let restored=false;function restore(){if(restored||editor.open)return;const saved=backup.list().filter(r=>r.type==='note'&&r.data.page===pageKey).sort((a,b)=>b.stamp-a.stamp)[0];if(saved){restored=true;draft=structuredClone(saved.data);openEditor()}}
  document.addEventListener('bracha-drafts-recovered',restore);restore();
  try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved){backup.put(saved.id,'note',saved);localStorage.removeItem(KEY);restore()}}catch{}

})();
</script></body>
